<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miles · Plan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
  <link rel="stylesheet" href="/theme.css">
  <script id="echarts-script" defer src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
  <style>
    .plan-view .plan-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.75rem; }
    .plan-view h1 {
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .plan-view .plan-head .mode-tabs { margin-bottom: 0; }

    /* Empty state */
    .plan-view .plan-empty {
      max-width: 32rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem 1.75rem;
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }
    .plan-view .plan-empty h2 { font-size: 1rem; color: var(--text); margin-bottom: 0.5rem; }
    .plan-view .plan-empty code {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.05rem 0.35rem;
      font-size: 0.8125rem;
    }

    .plan-view .chart-wrap { height: 260px; }
    @media (min-width: 640px) {
      .plan-view .chart-wrap { height: 320px; }
    }

    /* Phones: the tab row stays pinned while a tab scrolls. */
    .plan-view #plan-tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 0.5rem 0;
      margin-top: -0.5rem;
    }
    @media (min-width: 640px) {
      .plan-view #plan-tabs { position: static; padding: 0; margin-top: 0; }
    }
    .plan-view .chart-wrap-small { height: 190px; }
    .plan-view .subchart-label {
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.375rem;
    }
    .plan-view .chart-caption {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      margin-top: 0.625rem;
    }

    /* Custom chart legend — two encodings (actual bar / planned reference line),
       built as plain HTML like build.html's .cal-legend rather than an ECharts
       legend widget. */
    .plan-view .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem 1.25rem;
      align-items: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.625rem;
    }
    .plan-view .legend-swatch { display: inline-flex; align-items: center; gap: 0.375rem; }
    .plan-view .legend-box { width: 10px; height: 10px; border-radius: 2px; }
    .plan-view .legend-line { width: 16px; height: 0; border-top: 2px dashed var(--muted); }

    /* Adherence band chip — per-week read, on the calendar leader cell. */
    .plan-view .band-chip {
      display: inline-block;
      font-size: 0.5625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.0625rem 0.3125rem;
      border-radius: 999px;
      margin-top: 0.1875rem;
      color: #fff;
      width: fit-content;
    }

    /* Flags panel — deliberately absent from the DOM entirely when there are
       no active flags (see renderFlags): silence is the common case by design. */
    .plan-view .flags-panel {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }
    .plan-view .flag-item {
      display: flex;
      gap: 0.625rem;
      align-items: baseline;
      padding: 0.625rem 1.125rem;
      font-size: 0.8125rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--gridline);
    }
    .plan-view .flag-item:first-child { border-top: none; }
    .plan-view .flag-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--series-6);
      flex-shrink: 0;
      transform: translateY(-1px);
    }

    /* Goals — one row per goal; weekly goals draw a mark per plan week. Unscored
       weeks are an outline, met weeks muted, missed weeks the only loud mark. */
    .plan-view .goals-panel { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    .plan-view .goal-row { padding: 0.625rem 1rem; border-top: 1px solid var(--gridline); }
    .plan-view .goal-row:first-child { border-top: none; }
    .plan-view .goal-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.625rem; font-size: 0.8125rem; }
    .plan-view .goal-key { font-weight: 650; }
    .plan-view .goal-target, .plan-view .goal-why { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .plan-view .goal-strip { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 0.375rem; }
    .plan-view .goal-mark { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); }
    .plan-view .goal-mark.met { background: var(--border); }
    .plan-view .goal-mark.missed { background: var(--series-6); border-color: var(--series-6); }
    .plan-view .goal-progress { font-size: 0.8125rem; margin-top: 0.25rem; font-variant-numeric: tabular-nums; }
    .plan-view .goal-flag { display: flex; gap: 0.5rem; align-items: baseline; font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.25rem; }
    .plan-view .cwk-goals { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.25rem; }
    .plan-view .goal-chip { font-size: 0.6875rem; padding: 0 0.375rem; border-radius: 999px; border: 1px solid var(--gridline); color: var(--muted); font-variant-numeric: tabular-nums; }
    .plan-view .goal-chip.missed { color: var(--series-6); border-color: var(--series-6); }

    /* Calendar — each week is a summary row (.cwk-sum) over a collapsible
       body holding its days: a Monday through Sunday grid, or below the
       width that fits it (720px grid + main's 2rem gutters = 784px) stacked
       day rows (.cal-cards) — a second markup for the same days rather than
       a CSS reflow, since the day content's internal shape (stacked cell vs
       horizontal row) differs too much for one DOM to serve both cleanly. */
    .plan-view .cwk { margin-bottom: 0.5rem; scroll-margin-top: 4rem; }
    .plan-view .cwk-sum {
      display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
      background: var(--surface); border: 1px solid var(--gridline); border-radius: 8px; padding: 0.5rem 0.75rem;
    }
    .plan-view .cwk.current .cwk-sum { background: var(--pr-bg); }
    .plan-view .cwk-head { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; font-weight: 650; }
    .plan-view .cwk-head .band-chip { margin: 0; }
    .plan-view .cwk-chev { margin-left: auto; color: var(--muted); transition: transform 0.15s; }
    .plan-view .cwk-sum[aria-expanded="true"] .cwk-chev { transform: rotate(90deg); }
    .plan-view .cwk-line { display: flex; flex-wrap: wrap; gap: 0 0.75rem; font-size: 0.6875rem; color: var(--muted); margin-top: 0.1875rem; font-variant-numeric: tabular-nums; }
    .plan-view .cwk-note { font-size: 0.6875rem; color: var(--text-secondary); margin-top: 0.1875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plan-view .cwk-body { margin-top: 0.375rem; }
    .plan-view .cal-nav { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .plan-view .cal-divider { font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 1rem 0 0.5rem; }
    .plan-view .cal { border: 1px solid var(--gridline); border-radius: 8px; overflow-x: auto; overflow-y: hidden; }
    .plan-view .cal-header, .plan-view .cal-row {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      min-width: 720px;
    }
    .plan-view .cal-cards { display: none; }
    @media (max-width: 783px) {
      .plan-view .cal { display: none; }
      .plan-view .cal-cards { display: flex; flex-direction: column; gap: 0.75rem; }
      .plan-view .day-popover-run { min-height: 44px; padding: 0.625rem 0.5rem; }
    }
    .plan-view .cal-header .cal-hcell {
      font-size: 0.625rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
      padding: 0.375rem 0;
      background: var(--bg);
      border-bottom: 1px solid var(--gridline);
    }
    .plan-view .cal-row.current .cal-day { background: var(--pr-bg); }
    .plan-view .cal-day {
      min-height: 68px;
      background: var(--surface);
      border-top: 1px solid var(--gridline);
      border-left: 1px solid var(--gridline);
      margin-top: -1px;
      margin-left: -1px;
      position: relative;
      padding: 0.1875rem 0.3125rem;
    }
    .plan-view .cal-row:first-child .cal-day { border-top: none; margin-top: 0; }
    .plan-view .cal-daynum { position: absolute; top: 0.125rem; right: 0.25rem; font-size: 0.625rem; color: var(--muted); }

    /* Planned slot — muted chip underneath any actual run; one per session on
       a multi-session day (stacked via block display), number-first so the
       mileage/duration survives truncation instead of the title. */
    .plan-view .plan-slot {
      display: block;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 4px;
      padding: 0.125rem 0.3125rem 0.1875rem;
      margin-top: 0.6875rem;
      max-width: 100%;
    }
    .plan-view .plan-slot + .plan-slot { margin-top: 0.25rem; }
    .plan-view .plan-slot-num {
      font-weight: 700;
      font-size: 0.75rem;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .plan-view .plan-slot-label {
      font-size: 0.625rem;
      color: var(--muted);
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .plan-view .plan-slot.slot-rest {
      border-style: dotted;
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--muted);
      padding: 0.0625rem 0.3125rem;
    }
    .plan-view .plan-slot.slot-easy .plan-slot-num { color: var(--text-secondary); }
    .plan-view .plan-slot.slot-easy { border-color: color-mix(in srgb, var(--muted) 55%, var(--border)); }
    .plan-view .plan-slot.slot-workout { border-color: var(--series-8); }
    .plan-view .plan-slot.slot-workout .plan-slot-num { color: var(--series-8); }
    .plan-view .plan-slot.slot-long { border-color: var(--series-1); }
    .plan-view .plan-slot.slot-long .plan-slot-num { color: var(--series-1); }
    .plan-view .plan-slot.slot-race { border-color: var(--good); }
    .plan-view .plan-slot.slot-race .plan-slot-num { color: var(--good); }
    .plan-view .plan-slot.slot-strength { border-color: var(--series-5); }
    .plan-view .plan-slot.slot-strength .plan-slot-num { color: var(--series-5); }

    .plan-view .cal-day { cursor: pointer; }

    /* Mobile calendar — a week's day rows as one full-width card. No
       horizontal scroll: the weekday-column idiom only exists on the grid. */
    .plan-view .mcal-week { border: 1px solid var(--gridline); border-radius: 8px; overflow: hidden; background: var(--surface); }
    .plan-view .mcal-week.current { background: var(--pr-bg); }
    .plan-view .mcal-day-row {
      display: flex;
      gap: 0.5rem;
      padding: 0.4375rem 0.75rem;
      border-top: 1px solid var(--gridline);
      position: relative;
      cursor: pointer;
    }
    .plan-view .mcal-day-row:first-of-type { border-top: none; }
    .plan-view .mcal-day-row.rest { opacity: 0.7; }
    .plan-view .mcal-day-wd {
      flex: 0 0 2.125rem;
      padding-top: 0.0625rem;
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      flex-direction: column;
    }
    .plan-view .mcal-daynum { font-size: 0.5625rem; font-weight: 400; color: var(--muted); }
    .plan-view .mcal-day-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.25rem; }
    .plan-view .mcal-rest { font-size: 0.75rem; color: var(--muted); padding-top: 0.0625rem; }
    /* Session line — number first and never truncated, title after and
       ellipsized; mirrors the grid chip's number-first rule (see .plan-slot). */
    .plan-view .mcal-slot { display: flex; align-items: baseline; gap: 0.375rem; min-width: 0; }
    .plan-view .mcal-slot-num { font-weight: 700; font-size: 0.75rem; white-space: nowrap; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .plan-view .mcal-slot-label { font-size: 0.75rem; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .plan-view .mcal-day-row .cal-log-marker { top: 0.375rem; left: 0.125rem; }

    /* Today view — one kicker line, then a two-column at-a-glance grid:
       the session card is the hero on the left, the whole week's story
       (chips, last-week comparison) stacks dense on the right.
       Width-capped so it reads as one unit, and short enough that the
       whole tab fits a desktop viewport without scrolling. */

    .plan-view .today-kicker { font-size: 0.875rem; color: var(--text-secondary); }
    .plan-view .kicker-sub { font-size: 0.75rem; color: var(--muted); }

    .plan-view .today-grid {
      display: grid;
      grid-template-columns: minmax(280px, 2fr) 3fr;
      gap: 1rem;
      align-items: stretch;
      max-width: 66rem;
      margin-top: 0.75rem;
    }
    @media (max-width: 780px) {
      .plan-view .today-grid { grid-template-columns: 1fr; }
    }

    .plan-view .today-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .plan-view .panel-label {
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .plan-view .today-card .panel-label { margin-bottom: 0.375rem; }
    .plan-view .today-slot {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.125rem;
    }
    .plan-view .today-title { font-size: 1.0625rem; font-weight: 650; color: var(--text); margin-bottom: 0.25rem; }
    .plan-view .today-rest {
      font-size: 1.0625rem;
      font-weight: 650;
      color: var(--text);
      margin-bottom: 0.375rem;
    }
    .plan-view .today-targets { font-size: 0.8125rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; margin-bottom: 0.25rem; line-height: 1.6; }
    /* The session's lead figure ("6.0 mi", "8–10 × 3:00 @ …") — display size,
       so proportional figures, not tabular. */
    .plan-view .today-targets .target-lead {
      font-size: 1.5rem;
      font-weight: 650;
      color: var(--text);
      line-height: 1.2;
      font-variant-numeric: normal;
    }
    .plan-view .today-note { font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.55; }
    .plan-view .today-done { margin-top: 0.375rem; }
    .plan-view .today-next {
      margin-top: auto;
      padding-top: 0.625rem;
      border-top: 1px solid var(--gridline);
    }
    .plan-view .today-next-line {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    /* Right column — the week, one card, hairline-divided rows. */
    .plan-view .week-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .plan-view .week-card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
    }
    .plan-view .week-headline { font-size: 0.9375rem; font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; }
    .plan-view .week-note-line {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .plan-view .week-shape { font-size: 0.75rem; color: var(--muted); }
    .plan-view .week-divider { border-top: 1px solid var(--gridline); margin: 0.25rem 0; }
    .plan-view .vs-row { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
    .plan-view .vs-row .chart-legend { margin-top: 0; }

    .plan-view .day-chip-row { display: flex; gap: 0.375rem; margin: 0.125rem 0; }
    .plan-view .day-chip {
      flex: 1;
      min-width: 0;
      border-radius: 6px;
      padding: 0.375rem 0.125rem;
      text-align: center;
      cursor: pointer;
      border: 1.5px solid var(--chip-color);
      background: var(--surface);
    }
    .plan-view .day-chip-wd { font-size: 0.5625rem; font-weight: 600; text-transform: uppercase; color: var(--muted); }
    .plan-view .day-chip-num { font-size: 0.9375rem; font-weight: 700; color: var(--text); margin: 0.0625rem 0; }
    .plan-view .day-chip-slot { font-size: 0.5625rem; color: var(--chip-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plan-view .day-chip.done { background: color-mix(in srgb, var(--chip-color) 16%, var(--surface)); }
    .plan-view .day-chip.today { border-width: 2px; box-shadow: 0 0 0 2px color-mix(in srgb, var(--chip-color) 30%, transparent); }
    .plan-view .day-chip.upcoming { border-style: dashed; }

    .plan-view .week-headline small { font-size: 0.75rem; font-weight: 500; color: var(--muted); }

    /* Which plan the Plan tab shows: title and race, with a role pill unless it is the current plan. */
    .plan-view .plan-which { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.625rem; margin-bottom: 0.75rem; }
    .plan-view .plan-which-title { font-size: 1.125rem; font-weight: 650; color: var(--text); overflow-wrap: anywhere; }
    .plan-view .plan-which-race { font-size: 0.8125rem; color: var(--text-secondary); }
    .plan-view .plan-which-link { font-size: 0.75rem; color: var(--accent); }

    /* Compare mode: one grid per week with the sides' rows adjacent, so each
       weekday's cells sit one above the other; below 784px .cal-cards takes
       over with both sides' lines under each weekday. */
    .plan-view .cmp-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.375rem; vertical-align: baseline; }
    .plan-view .cmp-sum { font-size: 0.75rem; white-space: normal; }
    .plan-view .scroll:has(> .cmp-sum) { margin-bottom: 1.5rem; }
    .plan-view .cmp-sum th, .plan-view .cmp-sum td { padding: 0.375rem 0.25rem; }
    .plan-view .cmp-sum th { letter-spacing: 0; font-size: 0.625rem; }
    .plan-view .cmp-sum th.r, .plan-view .cmp-sum td.r { text-align: right; font-variant-numeric: tabular-nums; }
    .plan-view .cmp-sum-name { max-width: 5.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 600; }
    .plan-view .cmp-week { margin-bottom: 1rem; }
    .plan-view .cmp-week-head { display: flex; align-items: center; gap: 0.625rem; font-size: 0.8125rem; font-weight: 650; margin-bottom: 0.375rem; }
    .plan-view .cmp-line { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); min-width: 760px; }
    .plan-view .cmp-line .cal-header, .plan-view .cmp-line .cal-row { min-width: 0; }
    .plan-view .cmp-line-label { font-size: 0.75rem; font-weight: 600; padding: 0.375rem 0.5rem; border-top: 1px solid var(--gridline); background: var(--bg); }
    .plan-view .cmp-id { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .plan-view .cmp-mi { font-size: 1rem; font-weight: 750; color: var(--text); margin-right: 0.375rem; font-variant-numeric: tabular-nums; }
    .plan-view .cmp-sub { font-size: 0.6875rem; font-weight: 400; color: var(--muted); }
    .plan-view .cmp-line:first-child .cmp-line-label { border-top: none; }
    .plan-view .cmp-empty { font-size: 0.75rem; color: var(--muted); border-top: 1px dashed var(--gridline); padding: 0.375rem 0.5rem; }
    .plan-view .cmp-mlines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.25rem; }
    .plan-view .cmp-mline { display: flex; align-items: baseline; gap: 0.375rem; padding: 0.125rem 0.25rem; border-radius: 4px; }
    .plan-view .cmp-mdate { font-size: 0.625rem; color: var(--muted); min-width: 2.75rem; }
    .plan-view .cal-day.cmp-d1, .plan-view .cmp-mline.cmp-d1 { background: color-mix(in srgb, var(--series-7) 8%, var(--surface)); }
    .plan-view .cal-day.cmp-d2, .plan-view .cmp-mline.cmp-d2 { background: color-mix(in srgb, var(--series-7) 14%, var(--surface)); }
    .plan-view .cal-day.cmp-d3, .plan-view .cmp-mline.cmp-d3 { background: color-mix(in srgb, var(--series-7) 22%, var(--surface)); }
    .plan-view .cal-day.cmp-d4, .plan-view .cmp-mline.cmp-d4 { background: color-mix(in srgb, var(--series-7) 32%, var(--surface)); }
    .plan-view .draft-banner {
      font-size: 0.8125rem; margin-bottom: 0.75rem; padding: 0.5rem 0.75rem; border-radius: 8px;
      background: var(--pr-bg); border: 1px solid var(--series-3); color: var(--text);
    }

    .plan-view .vs-chart-wrap { margin: 0.375rem 0; flex: 1 1 240px; max-width: 360px; }
    .plan-view .vs-chart-wrap svg { display: block; width: 100%; height: auto; }

    .plan-view .doc-link { color: var(--accent); }
    .plan-view .today-docs { font-size: 0.8125rem; margin-top: 0.5rem; }
    .plan-view .doc-row { font-size: 0.875rem; padding: 0.25rem 0; }
    .plan-view .doc-dates { font-size: 0.75rem; color: var(--muted); margin-left: 0.375rem; }
    #section-docs { margin-bottom: 1rem; }

    /* Day detail popover — shared by the calendar and the Today strip. */
    .plan-view .day-popover-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .plan-view .day-popover {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      max-width: 22rem;
      width: calc(100% - 2rem);
      max-height: calc(100vh - 4rem);
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      position: relative;
    }
    .plan-view .day-popover-close {
      position: absolute;
      top: 0.5rem;
      right: 0.625rem;
      background: none;
      border: none;
      font-size: 1.25rem;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
    }
    .plan-view .day-popover-date { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.125rem; }
    .plan-view .day-popover-slot { font-size: 0.6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.125rem; }
    .plan-view .day-popover-title { font-size: 1rem; font-weight: 650; color: var(--text); margin-bottom: 0.625rem; }
    .plan-view .day-popover-targets { font-size: 0.8125rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; margin-bottom: 0.5rem; line-height: 1.6; }
    .plan-view .day-popover-note { font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 0.75rem; }
    /* A workout laid out block by block: amount and effort on one row, recovery and cue muted beneath. */
    .plan-view .steps { margin-bottom: 0.5rem; }
    .plan-view .step { padding: 0.375rem 0 0.375rem 0.625rem; border-left: 3px solid var(--baseline); border-bottom: 1px solid var(--gridline); }
    .plan-view .step.optional { border-left-style: dashed; }
    .plan-view .step-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.5rem; }
    .plan-view .step-amt { font-size: 0.9375rem; font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; }
    .plan-view .step-effort { font-size: 0.8125rem; color: var(--text-secondary); }
    .plan-view .step-tag { font-size: 0.625rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .plan-view .step-sub { font-size: 0.75rem; color: var(--muted); line-height: 1.4; }
    .plan-view .why { margin-bottom: 0.75rem; font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.5; }
    .plan-view .why summary { cursor: pointer; color: var(--muted); font-size: 0.75rem; }
    .plan-view .why p { margin-top: 0.25rem; }
    .plan-view .day-popover-section { margin-top: 0.625rem; }
    .plan-view .day-popover-log { font-size: 0.8125rem; color: var(--text-secondary); padding: 0.125rem 0; }
    .plan-view .day-popover-empty { font-size: 0.8125rem; color: var(--muted); }
    /* One block per session on a multi-session day — a hairline between
       blocks, none before the first. */
    .plan-view .day-popover-session + .day-popover-session {
      margin-top: 0.875rem;
      padding-top: 0.875rem;
      border-top: 1px solid var(--gridline);
    }

    /* Actual run — solid pill layered under/after the planned slot. */
    .plan-view .cal-run {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1.2;
      margin-top: 0.1875rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .plan-view .cal-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* Popover-only synced-run link — same look as .cal-run plus a hover
       background and an accent-colored affordance arrow; the whole row is
       tappable rather than just the text. */
    .plan-view .day-popover-run {
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      border-radius: 6px;
      padding: 0.4375rem 0.5rem;
      margin: 0.0625rem -0.5rem;
    }
    .plan-view .day-popover-run:hover { background: var(--bg); }
    .plan-view .day-popover-run-main { display: flex; align-items: center; gap: 0.25rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .plan-view .day-popover-run-arrow { color: var(--accent); flex-shrink: 0; margin-left: 0.5rem; }
    .plan-view .day-popover-run:hover .day-popover-run-arrow { text-decoration: underline; }

    /* plan_log annotation marker — small dot, top-left of the cell. */
    .plan-view .cal-log-marker {
      position: absolute;
      top: 0.1875rem;
      left: 0.25rem;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--series-3);
      cursor: help;
    }

    .plan-view .cal-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.75rem;
    }
    .plan-view .cal-legend .cal-dot { margin-right: 0.3125rem; }

    /* Version history */
    .plan-view .version-list { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
    .plan-view .version-item { border-bottom: 1px solid var(--border); }
    .plan-view .version-item:last-child { border-bottom: none; }
    .plan-view .version-head {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.75rem 1.125rem;
      cursor: pointer;
    }
    .plan-view .version-head:hover { background: var(--bg); }
    .plan-view .version-tag {
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--text);
      flex-shrink: 0;
    }
    .plan-view .version-date { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }
    .plan-view .version-author {
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: var(--bg);
      border-radius: 4px;
      padding: 0.0625rem 0.375rem;
      flex-shrink: 0;
    }
    .plan-view .version-note { font-size: 0.8125rem; color: var(--text-secondary); flex: 1; }
    .plan-view .version-toggle { font-size: 0.75rem; color: var(--accent); flex-shrink: 0; }
    .plan-view .version-diff {
      padding: 0 1.125rem 1rem;
      display: none;
    }
    .plan-view .version-diff.open { display: block; }
    .plan-view .diff-empty { font-size: 0.8125rem; color: var(--muted); padding: 0.5rem 0; }
    .plan-view .diff-week {
      display: flex;
      gap: 0.75rem;
      align-items: baseline;
      font-size: 0.8125rem;
      padding: 0.25rem 0;
      border-top: 1px solid var(--gridline);
    }
    .plan-view .diff-week:first-child { border-top: none; }
    .plan-view .diff-week-start { font-weight: 600; color: var(--text); flex-shrink: 0; width: 5.5rem; }
    .plan-view .diff-tag {
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.0625rem 0.375rem;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .plan-view .diff-tag.added { color: var(--good); background: var(--pr-bg); }
    .plan-view .diff-tag.removed { color: var(--series-6); background: color-mix(in srgb, var(--series-6) 12%, var(--surface)); }
    .plan-view .diff-tag.changed { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
    .plan-view .diff-fields { color: var(--muted); }

    /* Retrospective — occupies the Readiness slot once a plan completes
       (the same panel pointed backward: headline stats + evidence). The
       plan-vs-detected-build comparison reuses the site's bare
       <table>/.scroll styling from theme.css, not a bespoke component. */
    .plan-view .retro-note { font-size: 0.8125rem; color: var(--muted); margin-bottom: 0.75rem; }
    .plan-view .retro-link { color: inherit; text-decoration: none; }
    .plan-view .retro-link:hover { text-decoration: underline; }

    .plan-view .plan-which-role {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.125rem 0.625rem;
    }

    /* Readiness evidence rows — same anatomy as the retrospective (headline
       strip above, then compact evidence), each row a small figure + one
       sentence + a link deeper. Figures are fixed-size sparkline panels;
       detail lives in the tooltip, not on 72px of chart. */
    .plan-view .readiness-rows {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }
    .plan-view .readiness-row { padding: 0.75rem 1.125rem; border-top: 1px solid var(--gridline); }
    .plan-view .readiness-row:first-child { border-top: none; }
    .plan-view .readiness-row .chip-row { margin-bottom: 0.625rem; }
    .plan-view .readiness-row-body { display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap; }
    .plan-view .readiness-fig { width: 100%; height: 72px; flex-shrink: 0; }
    .plan-view .readiness-fig > div { width: 100%; height: 100%; }
    .plan-view .readiness-text { flex: 1; min-width: min(240px, 100%); }
    @media (min-width: 640px) {
      .plan-view .readiness-fig { width: 260px; }
    }
    .plan-view .readiness-text p {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      line-height: 1.5;
      margin-top: 0.25rem;
    }
    .plan-view .readiness-text .chart-legend { margin-top: 0.375rem; }
    .plan-view .readiness-link { color: var(--accent); text-decoration: none; white-space: nowrap; }
    .plan-view .readiness-link:hover { text-decoration: underline; }

    /* Latest-version annotation on the Version history header — the strip
       stat this page used to carry, demoted to context. */
    .plan-view .version-annot {
      font-size: 0.6875rem;
      font-weight: 400;
      color: var(--muted);
      margin-left: 0.625rem;
      letter-spacing: normal;
    }
  </style>
</head>
<body>
<script src="/nav.js"></script>
<script src="/charts.js"></script>

<main class="plan-view">
  <div class="plan-head">
    <h1>Plan</h1>
    <div class="mode-tabs" id="plan-tabs">
      <button class="mode-tab" data-tab="today">Today</button>
      <button class="mode-tab" data-tab="trends">Trends</button>
      <button class="mode-tab" data-tab="plan">Plan</button>
      <button class="mode-tab" data-tab="all">All</button>
    </div>
  </div>
  <div id="root"></div>
</main>

<script>
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g,
      ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function shortDate(dateStr) {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function longDate(dateStr) {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function addDays(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  const DIST_LABEL = { '5K': '5K', '10K': '10K', '15K': '15K', '10M': '10M', half: 'Half', '30K': '30K', marathon: 'Marathon', '50K': '50K' };
  function distLabel(bucket) { return DIST_LABEL[bucket] ?? bucket; }

  const TYPE_COLOR = {
    long_run: 'var(--series-1)',
    workout: 'var(--series-8)',
    race: 'var(--good)',
    easy: 'var(--muted)',
  };

  const SLOT_LABEL = { easy: 'Easy', workout: 'Workout', long: 'Long', rest: 'Rest', race: 'Race', strength: 'Strength' };

  // Planned-slot palette — one entry per plan.py SLOTS value, colors matching
  // TYPE_COLOR's actual-run-type mapping above (long/workout/race/easy share
  // the same hue whether the source is a synced run or a planned slot).
  // 'strength' has no synced-run counterpart in TYPE_COLOR (no page colors
  // WeightTraining runs), so it gets its own slot: --series-5 (violet), the
  // most CVD-distinct unused slot against the four already in use. Terrain is
  // never a color — a trail day gets the ▲ glyph instead (TRAIL_GLYPH below).
  const SLOT_COLOR = {
    easy: 'var(--muted)',
    workout: 'var(--series-8)',
    long: 'var(--series-1)',
    race: 'var(--good)',
    strength: 'var(--series-5)',
    rest: 'var(--baseline)',
  };
  const TRAIL_GLYPH = ' ▲'; // ▲ — terrain modifier, never a color (a trail long run is still a long run)

  const MILE_M = 1609.34;

  // 6.0 -> "6", 7.5 -> "7.5" — chip-sized mileage, no trailing zero.
  function trimMiles(v) {
    const s = v.toFixed(1);
    return s.endsWith('.0') ? s.slice(0, -2) : s;
  }

  // decimal minutes (150) -> "2:30"; whole minutes under an hour -> "30 min".
  function fmtDuration(min) {
    if (min == null) return null;
    const h = Math.floor(min / 60);
    const m = Math.round(min % 60);
    return h > 0 ? `${h}:${String(m).padStart(2, '0')}` : `${m} min`;
  }

  // seconds (180) -> "3:00" — rep durations, distinct from fmt.time/fmt.timeShort
  // (both h:mm-first, wrong shape for a sub-hour rep).
  function fmtMinSec(s) {
    if (s == null) return null;
    const m = Math.floor(s / 60);
    const sec = String(Math.round(s % 60)).padStart(2, '0');
    return `${m}:${sec}`;
  }

  // A week's target_miles/target_miles_hi as the label a coach would say:
  // "38–42" for a range, "38" for a point, "workouts only" when both are
  // NULL (deliberately unspecified — scored on workouts alone, see roadmap).
  function targetMilesLabel(w) {
    if (w.target_miles == null) return 'workouts only';
    if (w.target_miles_hi != null) return `${w.target_miles.toFixed(0)}–${w.target_miles_hi.toFixed(0)}`;
    return trimMiles(w.target_miles);
  }

  // Natural-language rendering of one plan_days row's target: rep range/
  // duration/pace ("8–10 × 3:00 @ 6:50–7:10/mi"), then the day-level mileage
  // or duration target ("2:30 trail long"). Shared by the Today card, the
  // week glance, and the day popover so the three views never describe a
  // day's target differently.
  function describeDayTarget(day) {
    if (!day) return [];
    const lines = [];
    const t = day.target || {};
    // Steps lay the structure out themselves; the single rep line would repeat them.
    const hasSteps = Array.isArray(t.steps) && t.steps.length > 0;
    let reps = null;
    if (t.reps_lo != null && t.reps_hi != null) reps = `${t.reps_lo}–${t.reps_hi}`;
    else if (t.reps != null) reps = `${t.reps}`;
    let unit = null;
    if (t.rep_duration_s != null) unit = fmtMinSec(t.rep_duration_s);
    else if (t.rep_distance_m != null) unit = `${(t.rep_distance_m / MILE_M).toFixed(2)}mi`;
    let pace = null;
    if (t.pace_lo != null && t.pace_hi != null) pace = `${fmt.pace(t.pace_lo)}–${fmt.pace(t.pace_hi)}/mi`;
    if (hasSteps) {
      // structure is shown by stepsHTML
    } else if (reps && unit) {
      lines.push(`${reps} × ${unit}${pace ? ` @ ${pace}` : ''}`);
    } else if (pace) {
      lines.push(`@ ${pace}`);
    } else if (t.zone_name) {
      lines.push(`${t.zone_name} pace`);
    }
    if (day.terrain === 'trail' && pace && !hasSteps) lines.push('trail — pace is guidance only, not judged');

    if (day.target_minutes != null) {
      const slotWord = (SLOT_LABEL[day.slot] ?? day.slot).toLowerCase();
      lines.push(`${fmtDuration(day.target_minutes)}${day.terrain === 'trail' ? ' trail' : ''} ${slotWord}`);
    } else if (day.target_miles != null) {
      lines.push(`${day.target_miles.toFixed(1)} mi`);
    }

    // HR band last so it never displaces the session structure as the lead
    // line; hr_hi alone is a ceiling ("keep HR under X"), the planner's
    // don't-overcook guardrail.
    if (t.hr_lo != null && t.hr_hi != null) lines.push(`HR ${Math.round(t.hr_lo)}–${Math.round(t.hr_hi)}`);
    else if (t.hr_hi != null) lines.push(`keep HR under ${Math.round(t.hr_hi)}`);
    else if (t.hr_lo != null) lines.push(`HR ${Math.round(t.hr_lo)}+`);
    return lines;
  }

  const REMAINING_WORD = { long: 'long run', easy: 'easy', workout: 'workout', strength: 'strength', race: 'race' };

  // "Left: 12 mi — Sun long run", or the week's-done line.
  function leftLine(ws) {
    if (!ws.remaining_days.length) return `Week's running is done`;
    const sessions = ws.remaining_days.map(d => {
      const wd = new Date(d.date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' });
      return `${wd} ${REMAINING_WORD[d.slot] ?? d.slot}`;
    }).join(', ');
    const miles = ws.remaining_planned_miles != null ? `${trimMiles(ws.remaining_planned_miles)} mi — ` : '';
    return `Left: ${miles}${sessions}`;
  }

  // Adherence bands — read straight off theme.css so light/dark both work,
  // same idiom as chartTheme() in nav.js but scoped to the three band colors.
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  const BAND_COLOR = { on: 'var(--good)', close: 'var(--series-3)', off: 'var(--series-6)' };
  const BAND_LABEL = { on: 'On plan', close: 'Close', off: 'Off plan' };

  // Flag shading on the weekly chart — one markArea per active flag,
  // spanning the consecutive weeks it summarizes. Colors echo the pattern's
  // nature: mileage flags reuse the "off" red, workout-count flags reuse the
  // calendar's workout orange, long-run flags reuse the calendar's long-run blue.
  const FLAG_COLOR = {
    mileage_off_low: '--series-6',
    mileage_off_high: '--series-6',
    workout_count_short: '--series-8',
    long_run_missed: '--series-1',
  };
  const FLAG_LABEL = {
    mileage_off_low: 'Mileage low',
    mileage_off_high: 'Mileage high',
    workout_count_short: 'Workouts short',
    long_run_missed: 'Long run missed',
  };

  // -----------------------------------------------------------------------
  // View tabs — house idiom (see races.html): buttons toggle .active on
  // click, panels toggle the `hidden` attribute, hash-routed with
  // history.replaceState so back doesn't step through tabs. Always built,
  // in every plan state (active, completed-only, or none at all) — Today
  // and Plan render different content per state, Trends is identical
  // everywhere (see renderProgressionEasy/Workouts/renderRecentMileage).
  // -----------------------------------------------------------------------

  const PLAN_TABS = ['today', 'trends', 'plan', 'all'];

  // ECharts measures its container at init, and every Trends/Plan chart is
  // built while its panel is hidden (zero-size) — so each instance registers
  // into the bucket for the tab it lives in and gets re-measured when that
  // tab is revealed.
  const TAB_CHARTS = { trends: [], plan: [] };

  // ECharts is deferred so Today paints without it; every chart render waits on this.
  const echartsReady = new Promise((resolve, reject) => {
    const script = document.getElementById('echarts-script');
    if (window.echarts) resolve();
    script.addEventListener('load', resolve);
    script.addEventListener('error', () => reject(new Error('chart library failed to load')));
  });

  // Each panel of the Trends/Plan tabs owns a slot that shows a skeleton
  // until its own data arrives, so one slow request delays only its panel.
  const TAB_SLOTS = {
    trends: [['easy', 220], ['workouts', 220], ['mileage', 220], ['load', 260], ['fitness', 24]],
    all: [['all', 220]],
    plan: [['plans', 40], ['head', 220], ['goals', 90], ['chart', 260], ['calendar', 320], ['docs', 0], ['flags', 0], ['versions', 120]],
  };

  // Every Trends/Plan-section render function inserts here; the first call
  // replaces the skeleton.
  function slotEl(id) {
    const el = document.getElementById(`slot-${id}`);
    if (el.dataset.pending) { el.innerHTML = ''; delete el.dataset.pending; }
    return el;
  }

  function slotHTML([id, height]) {
    return `<div id="slot-${id}" data-pending="1">${height ? `<div class="skeleton" style="height:${height}px;margin-bottom:1rem"></div>` : ''}</div>`;
  }

  // Resolves the inputs, renders them into the panel's slot, and turns any
  // failure into an inline error in that slot alone.
  function fillPanel(id, inputs, render) {
    return Promise.all(inputs)
      .then(vals => { render(...vals); slotEl(id); })
      .catch(err => {
        console.error(err);
        slotEl(id).insertAdjacentHTML('beforeend', `<p class="desc">Couldn't load this section: ${esc(err.message)}</p>`);
      });
  }

  function renderTabs() {
    document.getElementById('root').insertAdjacentHTML('beforeend', `
      <div id="tab-today" class="tab-panel"><div class="skeleton" style="height:240px"></div></div>
      <div id="tab-trends" class="tab-panel" hidden>${TAB_SLOTS.trends.map(slotHTML).join('')}</div>
      <div id="tab-plan" class="tab-panel" hidden>
        ${(COMPARE.length ? CMP_SLOTS : TAB_SLOTS.plan).map(slotHTML).join('')}
      </div>
      <div id="tab-all" class="tab-panel" hidden>${TAB_SLOTS.all.map(slotHTML).join('')}</div>`);
    document.querySelectorAll('#plan-tabs .mode-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        // The tab button means the current plan; ?plan= is only for links that carry it.
        // A compare page fills only the Plan tab, so every tab leaves it.
        if (COMPARE.length || (btn.dataset.tab === 'plan' && SELECTED_PLAN)) location.href = `${location.pathname}#${btn.dataset.tab}`;
        else activatePlanTab(btn.dataset.tab);
      });
    });
  }

  function activatePlanTab(key) {
    if (key === 'overall') key = 'plan'; // legacy bookmark from the old Today/Overall split
    if (!PLAN_TABS.includes(key)) key = 'today';
    document.querySelectorAll('#plan-tabs .mode-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
    document.querySelectorAll('.tab-panel').forEach(el => { el.hidden = el.id !== `tab-${key}`; });
    if (TAB_CHARTS[key]) TAB_CHARTS[key].forEach(c => c.resize());
    history.replaceState(null, '', `${location.search}#${key}`);
  }

  // -----------------------------------------------------------------------
  // Day detail popover — shared by the calendar (day cells + week leaders)
  // and the Today strip (session card + day-glance chips). Reads off the
  // already-fetched PLAN_DATA rather than issuing a new request — every
  // field it shows (day target, note, matched runs, log entries) is already
  // in the /api/plan payload.
  // -----------------------------------------------------------------------

  // { dayByDate, actualByDate, logByDate } — dayByDate values are seq-ordered
  // session arrays. PLAN_DATA is the current plan's (Today tab), PLAN_TAB_DATA
  // the plan shown on the Plan tab; both are set once on load.
  let PLAN_DATA = null;
  let PLAN_TAB_DATA = null;

  // todayActual (when given) is merged over the plan's own actuals: a plan's
  // window rarely covers "this week" once it has ended, so the Today views
  // always resolve against fresh data.
  function planData(data, todayActual) {
    return {
      dayByDate: data ? groupSessionsByDate(data.days) : new Map(),
      actualByDate: new Map([...(data ? Object.entries(data.actual ?? {}) : []), ...Object.entries(todayActual ?? {})]),
      logByDate: data ? new Map(Object.entries(data.log ?? {})) : new Map(),
      docs: data?.docs ?? [],
    };
  }

  // Plan documents whose date range covers dateStr (a start without an end covers that day).
  function docsOn(docs, dateStr) {
    return docs.filter(d => d.start_date && d.start_date <= dateStr && dateStr <= (d.end_date ?? d.start_date));
  }

  function docLinkHTML(doc) {
    return `<a class="doc-link" href="/doc.html?id=${doc.doc_id}">${esc(doc.title)}</a>`;
  }

  // Groups plan_days rows by date, preserving the server's date/seq order —
  // a date can carry more than one row (a double run, or a run plus a
  // strength day), so every consumer of dayByDate gets an array, never a
  // single row that would silently drop the rest.
  function groupSessionsByDate(days) {
    const m = new Map();
    for (const d of days) {
      const arr = m.get(d.date);
      if (arr) arr.push(d); else m.set(d.date, [d]);
    }
    return m;
  }

  // The day's `steps` as one row per block ("7 × 3 min", effort beside it,
  // recovery and cue muted beneath). Empty when the day has none.
  function stepsHTML(day) {
    const steps = day.target?.steps;
    if (!steps?.length) return '';
    const row = st => {
      const count = st.reps_lo != null && st.reps_hi != null ? `${st.reps_lo}–${st.reps_hi}` : st.reps;
      let amt = count != null ? `${count} × ${st.work}` : st.work;
      if (st.sets != null) amt = `${st.sets} × ${count != null ? `(${amt})` : amt}`;
      const rest = [st.rest, st.rest_mode].filter(Boolean).join(' · ');
      return `<div class="step${st.optional ? ' optional' : ''}">
        <div class="step-main">
          ${st.label ? `<span class="step-tag">${esc(st.label)}</span>` : ''}
          <span class="step-amt">${esc(amt)}</span>
          ${st.effort ? `<span class="step-effort">${esc(st.effort)}</span>` : ''}
          ${st.optional ? `<span class="step-tag">optional</span>` : ''}
        </div>
        ${rest ? `<div class="step-sub">Rest ${esc(rest)}</div>` : ''}
        ${st.set_rest ? `<div class="step-sub">Between sets ${esc(st.set_rest)}</div>` : ''}
        ${st.cue ? `<div class="step-sub">${esc(st.cue)}</div>` : ''}
      </div>`;
    };
    return `<div class="steps">${steps.map(row).join('')}</div>`;
  }

  // The day's rationale, collapsed.
  function whyHTML(day) {
    return day.rationale ? `<details class="why"><summary>Why</summary><p>${esc(day.rationale)}</p></details>` : '';
  }

  // One popover block per session: slot label, title, structure, totals,
  // guidance, rationale — in that order so the colored slot reads first,
  // same as the calendar chip.
  function daySessionBlockHTML(day) {
    const glyph = day.terrain === 'trail' ? TRAIL_GLYPH : '';
    const title = day.title ? esc(day.title) : (SLOT_LABEL[day.slot] ?? day.slot);
    const targetLines = describeDayTarget(day);
    return `
      <div class="day-popover-session">
        <div class="day-popover-slot" style="color:${SLOT_COLOR[day.slot] ?? 'var(--text)'}">${esc(SLOT_LABEL[day.slot] ?? day.slot)}</div>
        <div class="day-popover-title">${title}${glyph}</div>
        ${stepsHTML(day)}
        ${targetLines.length ? `<div class="day-popover-targets">${targetLines.map(l => `<div>${esc(l)}</div>`).join('')}</div>` : ''}
        ${day.note ? `<p class="day-popover-note">${esc(day.note)}</p>` : ''}
        ${whyHTML(day)}
      </div>`;
  }

  function dayPopoverHTML(dateStr, sessions, runs, logs, docs) {
    const body = sessions.length
      ? sessions.map(daySessionBlockHTML).join('')
      : `<div class="day-popover-title">Rest</div>`;
    return `
      <div class="day-popover-backdrop" id="day-popover-backdrop">
        <div class="day-popover" role="dialog" aria-modal="true">
          <button class="day-popover-close" id="day-popover-close" aria-label="Close">×</button>
          <div class="day-popover-date">${esc(longDate(dateStr))}</div>
          ${body}
          ${runs.length ? `<div class="day-popover-section"><div class="subchart-label">Synced</div>${runs.map(r => runLine(r, { showPace: true, link: true })).join('')}</div>` : ''}
          ${logs.length ? `<div class="day-popover-section"><div class="subchart-label">Log</div>${logs.map(l => `<div class="day-popover-log">${esc(l.action)}${l.reason ? ': ' + esc(l.reason) : ''}</div>`).join('')}</div>` : ''}
          ${docs.length ? `<div class="day-popover-section"><div class="subchart-label">Documents</div>${docs.map(d => `<div class="day-popover-log">📄 ${docLinkHTML(d)}</div>`).join('')}</div>` : ''}
          ${!sessions.length && !runs.length && !logs.length && !docs.length ? `<p class="day-popover-empty">No plan data for this day.</p>` : ''}
        </div>
      </div>`;
  }

  function openDayPopover(dateStr, data) {
    if (!data) return;
    const sessions = data.dayByDate.get(dateStr) ?? [];
    const runs = data.actualByDate.get(dateStr) ?? [];
    const logs = data.logByDate.get(dateStr) ?? [];
    const docs = docsOn(data.docs, dateStr);
    if (!sessions.length && !runs.length && !logs.length && !docs.length) return; // nothing to show for this date
    // Must land inside main.plan-view — every popover style is scoped under
    // it, and a body-level insert renders as unstyled text at the page bottom.
    document.querySelector('main.plan-view').insertAdjacentHTML('beforeend', dayPopoverHTML(dateStr, sessions, runs, logs, docs));
    const backdrop = document.getElementById('day-popover-backdrop');
    function close() {
      backdrop.remove();
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });
    document.getElementById('day-popover-close').addEventListener('click', close);
    document.addEventListener('keydown', onKey);
  }

  // -----------------------------------------------------------------------
  // No-plan-at-all card — the Plan tab's content when /api/plan returns
  // null (no active or completed plan exists at all).
  // -----------------------------------------------------------------------

  function renderPlanEmptyCard() {
    slotEl('head').insertAdjacentHTML('beforeend', `
      <div class="plan-empty">
        <h2>No training plan yet</h2>
        <p>Once a plan is drafted, this page tracks planned vs actual weekly mileage,
        a day-by-day calendar, and the version history as the plan evolves.</p>
        <p style="margin-top:0.75rem">Draft one in conversation with <code>miles:miles-plan</code> —
        it pulls your fitness estimate, past builds, and historical ramp/workout cadence,
        proposes a week-by-week skeleton, and writes it only once you approve.</p>
      </div>`);
  }

  // -----------------------------------------------------------------------
  // Readiness — "race is in N weeks, am I ready?", the first section of the
  // Plan tab for an ACTIVE plan (a completed plan renders the
  // retrospective in this slot instead — the same panel pointed backward).
  // Headline strip + three evidence rows off /api/plan-readiness; execution
  // reads the already-fetched /api/plan-adherence. Everything build-related
  // is aligned by weeks-out, both sides cut at the same point — see
  // plan_api.get_plan_readiness for the alignment rules.
  // -----------------------------------------------------------------------

  // Sub-hour results read as "M:SS", longer as fmt.timeShort's "h:mm" —
  // compare.html's chip-result convention.
  function fmtResult(s) {
    if (s == null) return '';
    if (s < 3600) {
      const m = Math.floor(s / 60);
      const sec = String(Math.round(s % 60)).padStart(2, '0');
      return `${m}:${sec}`;
    }
    return fmt.timeShort(s);
  }

  // Plan-window fitness trend as a glyph: pace falling (negative sec/mi) is
  // improving. Deltas under 2 s/mi read as flat — smaller than anything the
  // monthly checkpoints can honestly resolve.
  function trendGlyph(t) {
    if (t == null) return '';
    if (Math.abs(t) < 2) return '—';
    return t < 0 ? '▾' : '▴';
  }

  function trendPhrase(t) {
    if (t == null) return null;
    if (Math.abs(t) < 2) return 'flat over the plan so far';
    return `${t < 0 ? '−' : '+'}${fmtMinSec(Math.abs(t))}/mi over the plan so far`;
  }

  // The reference-build choice is shared across every surface that compares
  // against a reference, persisted per distance bucket. A stored date that no
  // longer resolves to a candidate falls back to the PR build silently.
  function refStorageKey(bucket) { return `miles.refBuild.${bucket}`; }

  function resolveRefDate(builds) {
    let stored = null;
    try { stored = localStorage.getItem(refStorageKey(builds.bucket)); } catch { /* storage unavailable */ }
    if (stored && builds.by_date[stored]) return stored;
    const pr = builds.candidates.find(c => c.is_pr);
    return (pr ?? builds.candidates[0]).race_date;
  }

  function saveRefDate(bucket, date) {
    try { localStorage.setItem(refStorageKey(bucket), date); } catch { /* storage unavailable */ }
  }

  function refShortName(builds, date) {
    const c = builds.candidates.find(x => x.race_date === date);
    return c ? fmt.shortName(c.name ?? '', c.race_date) : date;
  }

  function refChipsHTML(builds, selDate) {
    return builds.candidates.map(c => {
      const sel = c.race_date === selDate;
      const label = `${fmt.shortName(c.name ?? '', c.race_date)}${c.result_s != null ? ` · ${fmtResult(c.result_s)}` : ''}`;
      return `<button class="chip${sel ? ' selected' : ''}" data-ref-date="${c.race_date}" title="${c.is_pr ? 'PR build (default)' : 'flip the comparison'}">
        <span class="dot" style="background:${sel ? 'var(--accent)' : 'var(--baseline)'}"></span>${esc(label)}</button>`;
    }).join('');
  }

  function buildSentence(builds, refDate, planWeeks) {
    const cur = builds.current, ref = builds.by_date[refDate];
    const k = builds.through_weeks_out, w = builds.window_weeks;
    const peaks = cur.peak_week != null || ref.peak_week != null
      ? ` · peak ${cur.peak_week != null ? cur.peak_week.toFixed(1) : '—'} vs ${ref.peak_week != null ? ref.peak_week.toFixed(1) : '—'}`
      : '';
    const overlapNote = planWeeks > w ? `, comparing the overlapping ${w} wk` : '';
    return `Avg ${cur.avg_mpw.toFixed(1)} vs ${ref.avg_mpw.toFixed(1)} mpw · long runs ${cur.long_runs} vs ${ref.long_runs}${peaks} — both through ${k} wk out${overlapNote}.`;
  }

  function fitnessSentence(goal) {
    const bits = [];
    if (goal.predicted_time_s != null) {
      bits.push(`Predicted ${fmt.time(Math.round(goal.predicted_time_s))}${goal.basis ? ` (${goal.basis})` : ''}`);
    }
    if (goal.goal_time_s != null) bits.push(`goal ${fmt.time(goal.goal_time_s)}`);
    const trend = trendPhrase(goal.trend_s_per_mi);
    if (trend) bits.push(trend);
    if (!bits.length) return 'No tracked fitness prediction at this distance.';
    return `${bits.join('; ')}.`;
  }

  function sessionsSentence(sessions) {
    const parts = [];
    parts.push(sessions.workouts_total > 0
      ? `${sessions.workouts_in_band} of ${sessions.workouts_total} workouts in their target band over the last ${sessions.window_weeks} wk`
      : `no workouts with a target band matched in the last ${sessions.window_weeks} wk`);
    if (sessions.longest_run_mi != null) {
      const peak = sessions.plan_peak_long_run_miles != null ? ` (plan peaks at ${trimMiles(sessions.plan_peak_long_run_miles)})` : '';
      parts.push(`longest run ${sessions.longest_run_mi.toFixed(1)} mi${peak}`);
    }
    return `${parts.map((p, i) => i === 0 ? p.charAt(0).toUpperCase() + p.slice(1) : p).join(' · ')}.`;
  }

  // Sparkline base: no on-chart axes at 72px tall — identity comes from the
  // adjacent sentence/legend, detail from the tooltip.
  function miniOption(theme) {
    return {
      animation: false,
      grid: { top: 8, right: 8, bottom: 8, left: 8 },
      tooltip: {
        backgroundColor: theme.surface,
        borderColor: theme.gridline,
        textStyle: { fontSize: 12, color: theme.text },
      },
    };
  }

  function initFitnessFig(goal, theme) {
    const el = document.getElementById('readiness-fig-fitness');
    if (!el) return;
    const data = goal.checkpoints.map(c => [`${c.month}-01`, c.pace_min_per_mile]);
    const paceVals = data.map(d => d[1]).concat(goal.goal_pace_min_per_mile != null ? [goal.goal_pace_min_per_mile] : []);
    const pad = 0.15;
    const opt = miniOption(theme);
    opt.tooltip.trigger = 'axis';
    opt.tooltip.formatter = params => {
      const p = params[0];
      return `<div style="font-weight:600;color:${theme.text}">${p.value[0].slice(0, 7)}</div>${fmt.pace(p.value[1])}/mi predicted`;
    };
    opt.xAxis = { type: 'time', show: false };
    opt.yAxis = {
      type: 'value', inverse: true, show: false,
      min: Math.min(...paceVals) - pad, max: Math.max(...paceVals) + pad,
    };
    opt.series = [{
      name: 'Predicted pace',
      type: 'line',
      data,
      showSymbol: true,
      symbolSize: 5,
      lineStyle: { color: theme.series[0], width: 2 },
      itemStyle: { color: theme.series[0] },
      markLine: goal.goal_pace_min_per_mile != null ? {
        silent: true,
        symbol: 'none',
        label: { show: false },
        lineStyle: { color: theme.muted, type: 'dashed', width: 1.5 },
        data: [{ yAxis: goal.goal_pace_min_per_mile }],
      } : undefined,
    }];
    const chart = echarts.init(el);
    chart.setOption(opt);
    TAB_CHARTS.plan.push(chart);
    window.addEventListener('resize', () => chart.resize());
  }

  function initSessionsFig(sessions, theme) {
    const el = document.getElementById('readiness-fig-sessions');
    if (!el) return;
    const pts = sessions.points;
    const bandBase = pts.map(p => [p.date, p.pace_lo]);
    const bandRange = pts.map(p => [p.date, p.pace_hi - p.pace_lo]);
    const dots = pts.map(p => ({ value: [p.date, p.pace_min_per_mile], meta: p }));
    const vals = pts.flatMap(p => [p.pace_lo, p.pace_hi, p.pace_min_per_mile]);
    const opt = miniOption(theme);
    opt.tooltip.trigger = 'item';
    opt.tooltip.formatter = params => {
      const p = params.data && params.data.meta;
      if (!p) return '';
      return `<div style="font-weight:600;color:${theme.text}">${shortDate(p.date)}</div>
        ${fmt.pace(p.pace_min_per_mile)}/mi vs ${fmt.pace(p.pace_lo)}–${fmt.pace(p.pace_hi)}${p.in_band ? '' : ' (outside band)'}`;
    };
    opt.xAxis = { type: 'time', show: false };
    opt.yAxis = { type: 'value', inverse: true, show: false, min: Math.min(...vals) - 0.25, max: Math.max(...vals) + 0.25 };
    opt.series = [
      { name: 'band-base', type: 'bar', stack: 'band', data: bandBase, barWidth: 8, itemStyle: { color: 'transparent' }, silent: true, tooltip: { show: false } },
      { name: 'Target band', type: 'bar', stack: 'band', data: bandRange, barWidth: 8, itemStyle: { color: withAlpha(theme.muted, 0.35) }, silent: true, tooltip: { show: false } },
      { name: 'Workout pace', type: 'scatter', data: dots, symbolSize: 7, itemStyle: { color: theme.series[7] }, z: 3 },
    ];
    const chart = echarts.init(el);
    chart.setOption(opt);
    TAB_CHARTS.plan.push(chart);
    window.addEventListener('resize', () => chart.resize());
  }

  // The build row's figure + sentence + strip stat all follow the flipped
  // reference; the chart is a single instance that gets setOption'd on flip,
  // so the TAB_CHARTS.plan resize registration stays valid.
  function initBuildRow(builds, planWeeks) {
    const el = document.getElementById('readiness-fig-build');
    if (!el) return;
    const theme = chartTheme();
    const accent = cssVar('--accent');
    const curData = builds.current.weekly.map(w => [w.offset, w.miles]);

    const opt = miniOption(theme);
    opt.tooltip.trigger = 'axis';
    opt.tooltip.formatter = params => {
      if (!params.length) return '';
      const head = `<div style="font-weight:600;color:${theme.text}">${-params[0].value[0]} wk out</div>`;
      return head + params.map(p => `${esc(p.seriesName)}: ${p.value[1].toFixed(1)} mi`).join('<br>');
    };
    opt.xAxis = { type: 'value', show: false, min: -builds.window_weeks, max: -builds.through_weeks_out };
    opt.yAxis = { type: 'value', show: false, min: 0 };
    opt.series = [
      { name: 'This block', type: 'line', data: curData, showSymbol: false, lineStyle: { color: accent, width: 2 }, itemStyle: { color: accent }, z: 3 },
      { name: '', type: 'line', data: [], showSymbol: false, lineStyle: { color: theme.muted, width: 2 }, itemStyle: { color: theme.muted }, z: 2 },
    ];
    const chart = echarts.init(el);
    chart.setOption(opt);
    TAB_CHARTS.plan.push(chart);
    window.addEventListener('resize', () => chart.resize());

    function applyReference(refDate) {
      const refName = refShortName(builds, refDate);
      chart.setOption({ series: [{}, { name: refName, data: builds.by_date[refDate].weekly.map(w => [w.offset, w.miles]) }] });
      document.getElementById('readiness-chips').innerHTML = refChipsHTML(builds, refDate);
      document.getElementById('readiness-build-sentence').textContent = buildSentence(builds, refDate, planWeeks);
      document.getElementById('readiness-build-legend').innerHTML = `
        <span class="legend-swatch"><span class="legend-box" style="background:${accent}"></span>This block</span>
        <span class="legend-swatch"><span class="legend-box" style="background:${theme.muted}"></span>${esc(refName)}</span>`;
      const statValue = document.getElementById('readiness-stat-build-value');
      const statSub = document.getElementById('readiness-stat-build-sub');
      if (statValue) statValue.textContent = `${builds.current.avg_mpw.toFixed(1)} vs ${builds.by_date[refDate].avg_mpw.toFixed(1)}`;
      if (statSub) statSub.textContent = `vs ${refName} · both at ${builds.through_weeks_out} wk out`;
    }

    applyReference(resolveRefDate(builds));
    document.getElementById('readiness-chips').addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn || !builds.by_date[btn.dataset.refDate]) return;
      saveRefDate(builds.bucket, btn.dataset.refDate);
      applyReference(btn.dataset.refDate);
    });
  }

  function renderReadiness(data, adherence, readiness) {
    if (!readiness) return;
    const { goal, builds, sessions } = readiness;
    const theme = chartTheme();
    // Weeks before race week the latest version covers — the sub-label cue
    // when the reference window is shorter than the plan.
    const planWeeks = Math.max(0, data.weeks.length - 1);

    const weeksToRaceStat = `
      <div class="stat">
        <div class="stat-label">Weeks to race</div>
        <div class="stat-value">${readiness.weeks_to_race}<span class="stat-sub">${shortDate(readiness.race_date)}</span></div>
      </div>`;

    const glyph = trendGlyph(goal.trend_s_per_mi);
    let goalStat = '';
    if (goal.goal_time_s != null) {
      goalStat = `
        <div class="stat">
          <div class="stat-label">Goal vs fitness</div>
          <div class="stat-value">${fmt.time(goal.goal_time_s)}<span class="stat-sub">goal</span></div>
          <div class="stat-sub">${goal.predicted_time_s != null
            ? `${fmt.time(Math.round(goal.predicted_time_s))} predicted · ${esc(goal.basis ?? goal.confidence ?? '')}${glyph ? ` ${glyph}` : ''}`
            : 'no current fitness estimate'}</div>
        </div>`;
    } else if (goal.predicted_time_s != null) {
      goalStat = `
        <div class="stat">
          <div class="stat-label">Fitness</div>
          <div class="stat-value">${fmt.time(Math.round(goal.predicted_time_s))}<span class="stat-sub">predicted · no goal set</span></div>
          <div class="stat-sub">${esc(goal.basis ?? goal.confidence ?? '')}${glyph ? ` ${glyph}` : ''}</div>
        </div>`;
    }

    const buildStat = builds ? `
      <div class="stat">
        <div class="stat-label">Build vs reference</div>
        <div class="stat-value"><span id="readiness-stat-build-value"></span><span class="stat-sub">mpw</span></div>
        <div class="stat-sub" id="readiness-stat-build-sub"></div>
      </div>` : '';

    const executionStat = adherence ? `
      <div class="stat">
        <div class="stat-label">Execution</div>
        <div class="stat-value">${adherence.on_or_close}<span class="stat-sub">of ${adherence.completed} wk on plan</span></div>
        <div class="stat-sub">${adherence.flags.length ? `${adherence.flags.length} pattern${adherence.flags.length === 1 ? '' : 's'} flagged` : 'no patterns flagged'}</div>
      </div>` : '';

    const showFitnessRow = goal.goal_time_s != null || goal.predicted_time_s != null || goal.checkpoints.length > 0;
    const fitnessRow = showFitnessRow ? `
      <div class="readiness-row">
        <div class="readiness-row-body">
          ${goal.checkpoints.length ? `<div class="readiness-fig"><div id="readiness-fig-fitness"></div></div>` : ''}
          <div class="readiness-text">
            <span class="panel-label">Fitness</span>
            <p>${esc(fitnessSentence(goal))} <a class="readiness-link" href="/training.html">Fitness chart →</a></p>
          </div>
        </div>
      </div>` : '';

    const buildRow = builds ? `
      <div class="readiness-row">
        <div class="chip-row" id="readiness-chips"></div>
        <div class="readiness-row-body">
          <div class="readiness-fig"><div id="readiness-fig-build"></div></div>
          <div class="readiness-text">
            <span class="panel-label">Build vs reference</span>
            <p id="readiness-build-sentence"></p>
            <div class="chart-legend" id="readiness-build-legend"></div>
          </div>
        </div>
      </div>` : '';

    const sessionsRow = sessions ? `
      <div class="readiness-row">
        <div class="readiness-row-body">
          ${sessions.points.length ? `<div class="readiness-fig"><div id="readiness-fig-sessions"></div></div>` : ''}
          <div class="readiness-text">
            <span class="panel-label">Sessions</span>
            <p>${esc(sessionsSentence(sessions))} <a class="readiness-link" href="#section-progression-workouts">Workout progression ↓</a></p>
          </div>
        </div>
      </div>` : '';

    const rows = fitnessRow + buildRow + sessionsRow;
    slotEl('head').insertAdjacentHTML('beforeend', `
      <section id="section-readiness">
        <h2>Readiness</h2>
        <p class="desc">Goal vs fitness, this block vs a reference build, and session execution — build numbers are cumulative through the same weeks-out point on both sides${builds ? ' · flip the chips to change the reference' : ''}</p>
        <div class="stat-strip">
          ${weeksToRaceStat}
          ${goalStat}
          ${buildStat}
          ${executionStat}
        </div>
        ${rows ? `<div class="readiness-rows">${rows}</div>` : ''}
      </section>`);

    if (goal.checkpoints.length) initFitnessFig(goal, theme);
    if (sessions && sessions.points.length) initSessionsFig(sessions, theme);
    if (builds) initBuildRow(builds, planWeeks);
  }

  // -----------------------------------------------------------------------
  // Race retrospective — takes over the Readiness slot once /api/plan
  // reports plan.status === 'completed'. Reads /api/plan-retrospective for
  // the numbers the forward view can't answer: final adherence, race result
  // vs goal vs a pre-race fitness prediction, and the plan's target ramp vs
  // what detect_builds() independently saw. The weekly-mileage chart,
  // calendar, and version history below are unchanged — "the record of what
  // happened" stays visible either way.
  // -----------------------------------------------------------------------

  function buildCompareTable(ramp, build) {
    if (!ramp && !build) return '';
    const rows = [
      ['Weeks', ramp ? ramp.weeks : null, build.found ? build.weeks : null],
      ['Avg weekly miles', ramp ? ramp.avg_target_miles.toFixed(1) : null, build.avg_mpw != null ? build.avg_mpw.toFixed(1) : null],
      ['Peak', ramp ? ramp.peak_target_miles.toFixed(1) : null, build.peak_3wk_avg != null ? `${build.peak_3wk_avg.toFixed(1)} (3wk avg)` : null],
    ];
    const note = build.found
      ? `bounded by ${esc(build.bounded_by ?? '—')}${build.thin ? ' · thin build' : ''}, starting ${build.start ? shortDate(build.start) : '—'}`
      : `detect_builds found no race-anchored build for this race (below its anchor-distance floor, or too little surrounding volume) — plan-only numbers shown`;
    return `
      <div class="scroll" style="margin-top:0.75rem">
        <table>
          <thead><tr><th></th><th class="r">Plan</th><th class="r">Detected build</th></tr></thead>
          <tbody>
            ${rows.map(([label, a, b]) => `<tr><td>${label}</td><td class="r">${a ?? '—'}</td><td class="r">${b ?? '—'}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
      <p class="chart-caption">${esc(note)}</p>`;
  }

  function renderRetrospective(data, retro, goals) {
    const { plan } = data;
    if (!retro) {
      slotEl('head').insertAdjacentHTML('beforeend', `
        <div class="stat-strip"><div class="stat">
          <div class="stat-label">Retrospective</div>
          <div class="stat-value">—<span class="stat-sub">loading…</span></div>
        </div></div>`);
      return;
    }

    const fa = retro.final_adherence;
    const adherenceStat = fa ? `
      <div class="stat">
        <div class="stat-label">Final adherence</div>
        <div class="stat-value">${fa.weeks_on_or_close}<span class="stat-sub">of ${fa.weeks_completed} weeks</span></div>
        <div class="stat-sub">${fa.pct_of_planned_miles != null ? `${Math.round(fa.pct_of_planned_miles)}% of planned miles` : ''}</div>
      </div>` : '';

    const race = retro.race;
    const raceStat = race ? `
      <div class="stat">
        <div class="stat-label">Race result</div>
        <div class="stat-value">
          <a class="retro-link" href="/build.html#${race.date}" title="View build">${esc(race.finish_time)}</a>
          <span class="stat-sub">${esc(race.name ?? '')}</span>
        </div>
        <div class="stat-sub">${race.pace_min_per_mile != null ? `${fmt.pace(race.pace_min_per_mile)}/mi` : ''}</div>
      </div>` : `
      <div class="stat">
        <div class="stat-label">Race result</div>
        <div class="stat-value">—<span class="stat-sub">no matching synced race</span></div>
      </div>`;

    const goal = retro.goal;
    const goalStat = (goal.goal_time_s != null || goal.predicted_time_s != null) ? `
      <div class="stat">
        <div class="stat-label">Goal vs predicted</div>
        <div class="stat-value">${goal.goal_time_s != null ? fmt.time(goal.goal_time_s) : '—'}<span class="stat-sub">goal</span></div>
        <div class="stat-sub">${goal.predicted_time != null ? `${goal.predicted_time} predicted (${esc(goal.predicted_confidence ?? '')})` : 'no pre-race fitness estimate'}</div>
      </div>` : '';

    const goalStats = (goals?.goals ?? []).map(g => {
      if (g.horizon === 'weekly') {
        const scored = g.weeks.filter(w => w.value != null);
        return `<div class="stat">
          <div class="stat-label">${esc(g.key)}</div>
          <div class="stat-value">${scored.filter(w => w.met).length}<span class="stat-sub">of ${scored.length} weeks met</span></div>
        </div>`;
      }
      return `<div class="stat">
        <div class="stat-label">${esc(g.key)}</div>
        <div class="stat-value">${g.progress.met ? 'Met' : 'Not met'}</div>
        <div class="stat-sub">${esc(goalProgressText(g))}</div>
      </div>`;
    }).join('');

    slotEl('head').insertAdjacentHTML('beforeend', `
      <section id="section-retrospective">
        <h2>Race retrospective</h2>
        <p class="desc">${esc(plan.title)} closed out ${shortDate(plan.race_date)}</p>
        <div class="stat-strip">
          ${adherenceStat}
          ${raceStat}
          ${goalStat}
          ${goalStats}
        </div>
        ${buildCompareTable(retro.plan_ramp, retro.detected_build)}
      </section>`);
  }

  // -----------------------------------------------------------------------
  // Planned-vs-actual weekly chart
  // -----------------------------------------------------------------------

  // Computed, numbers-first caption for the weekly-mileage chart — first vs
  // last COMPLETED week's actual/target miles, spanning however many
  // completed weeks exist. "" (and no <p>) below 2 completed weeks.
  function mileageCaption(weeks) {
    // Unspecified weeks (no target_miles) have nothing to average into a
    // target caption — excluded here, same as plan_ramp's rollup.
    const completed = weeks.filter(w => !w.is_current && !w.is_future && w.target_miles != null);
    if (completed.length < 2) return '';
    const first = completed[0], last = completed[completed.length - 1];
    return `weekly mileage ${first.actual_miles.toFixed(0)}→${last.actual_miles.toFixed(0)} mi ` +
      `over ${completed.length} weeks (target ${targetMilesLabel(first)}→${targetMilesLabel(last)})`;
  }

  // One markArea span per active flag, covering the consecutive weeks
  // it summarizes — a visual echo of the flags panel below, right on the
  // chart where the pattern actually happened.
  function flagMarkAreas(flags) {
    if (!flags || !flags.length) return [];
    return flags.map(f => {
      const color = withAlpha(cssVar(FLAG_COLOR[f.type] ?? '--muted'), 0.16);
      return [
        { xAxis: f.since, itemStyle: { color }, label: { show: false } },
        { xAxis: addDays(f.since, f.weeks * 7) },
      ];
    });
  }

  // The week's one mileage number: a range week at its midpoint, null when unspecified.
  function repMiles(w) {
    return w.target_miles == null ? null : w.target_miles_hi != null ? (w.target_miles + w.target_miles_hi) / 2 : w.target_miles;
  }

  function renderChart(data, bandByWeek, flags) {
    const { weeks } = data;
    if (!weeks.length) return;

    const hasBands = bandByWeek && bandByWeek.size > 0;
    const hasFlags = flags && flags.length > 0;
    const caption = mileageCaption(weeks);
    const flagTypesPresent = hasFlags ? [...new Set(flags.map(f => f.type))] : [];

    slotEl('chart').insertAdjacentHTML('beforeend', `
      <section id="section-chart">
        <h2>Weekly mileage</h2>
        <p class="desc">Bars are actual synced miles${hasBands ? ', colored by adherence band' : ''} · dashed line is the planned weekly target · current week is still in progress${hasFlags ? ' · shaded span marks a flagged pattern' : ''}</p>
        <div class="chart-wrap"><div id="chart-weekly" style="width:100%;height:100%"></div></div>
        <div class="chart-legend">
          ${hasBands ? `
          <span class="legend-swatch"><span class="legend-box" style="background:${cssVar('--good')}"></span>On plan</span>
          <span class="legend-swatch"><span class="legend-box" style="background:${cssVar('--series-3')}"></span>Close</span>
          <span class="legend-swatch"><span class="legend-box" style="background:${cssVar('--series-6')}"></span>Off plan</span>
          ` : `<span class="legend-swatch"><span class="legend-box" style="background:var(--series-2)"></span>Actual miles</span>`}
          <span class="legend-swatch"><span class="legend-line"></span>Planned target</span>
          ${flagTypesPresent.map(t => `<span class="legend-swatch"><span class="legend-box" style="background:${withAlpha(cssVar(FLAG_COLOR[t] ?? '--muted'), 0.5)}"></span>${FLAG_LABEL[t] ?? t}</span>`).join('')}
        </div>
        ${caption ? `<p class="chart-caption">${esc(caption)}</p>` : ''}
      </section>`);

    const theme = chartTheme();
    const barData = weeks.map(w => {
      const band = bandByWeek ? bandByWeek.get(w.week_start) : undefined;
      const base = band ? cssVar(`--${band === 'on' ? 'good' : band === 'close' ? 'series-3' : 'series-6'}`) : theme.series[1];
      return {
        value: [w.week_start, w.actual_miles],
        itemStyle: w.is_current
          ? { color: withAlpha(base, 0.55), borderRadius: [2, 2, 0, 0] }
          : { color: base, borderRadius: [2, 2, 0, 0] },
      };
    });
    // Range weeks plot at the midpoint of [lo, hi]; unspecified weeks (both
    // NULL) leave a gap in the dashed line, same as any week with no target.
    const lineData = weeks.map(w => [w.week_start, repMiles(w)]);
    const markArea = hasFlags ? { silent: true, data: flagMarkAreas(flags) } : undefined;

    const chart = echarts.init(document.getElementById('chart-weekly'));
    TAB_CHARTS.plan.push(chart);
    chart.setOption({
      animation: false,
      grid: { top: 24, right: 24, bottom: 32, left: 48 },
      tooltip: {
        trigger: 'axis',
        backgroundColor: theme.surface,
        borderColor: theme.gridline,
        textStyle: { fontSize: 12, color: theme.text },
        formatter(params) {
          // Index by dataIndex, not axisValue — on a time-type x axis, axisValue
          // is a numeric timestamp, not the original 'YYYY-MM-DD' week_start string.
          const w = weeks[params[0].dataIndex];
          if (!w) return '';
          const tag = w.is_current ? ' (in progress)' : w.is_future ? ' (upcoming)' : '';
          const band = bandByWeek ? bandByWeek.get(w.week_start) : undefined;
          const bandLine = band ? `<br>${BAND_LABEL[band]}` : '';
          return `<div style="font-weight:600;margin-bottom:2px;color:${theme.text}">${shortDate(w.week_start)}${tag}</div>
            Actual: ${w.actual_miles.toFixed(1)} mi<br>
            Target: ${targetMilesLabel(w)} mi · ${w.phase}${bandLine}`;
        },
      },
      xAxis: {
        type: 'time',
        axisLine: { lineStyle: { color: theme.gridline } },
        axisTick: { show: false },
        axisLabel: { fontSize: 11, color: theme.muted },
        ...(theme.compact ? { splitNumber: 4 } : {}),
      },
      yAxis: {
        type: 'value',
        name: 'Miles',
