        nameLocation: 'middle',
        nameGap: 34,
        nameTextStyle: { fontSize: 11, color: theme.muted },
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { lineStyle: { color: theme.gridline } },
        axisLabel: { fontSize: 11, color: theme.muted },
      },
      series: [
        {
          name: 'Actual miles',
          type: 'bar',
          data: barData,
          barMaxWidth: 16,
          z: 2,
          markArea,
        },
        {
          name: 'Planned target',
          type: 'line',
          data: lineData,
          step: 'end',
          showSymbol: false,
          lineStyle: { color: theme.muted, width: 2, type: 'dashed' },
          z: 3,
        },
      ],
    });
    window.addEventListener('resize', () => chart.resize());
  }

  // -----------------------------------------------------------------------
  // Weekly calendar
  // -----------------------------------------------------------------------

  function mondayOf(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const dow = (d.getDay() + 6) % 7; // Mon=0..Sun=6
    d.setDate(d.getDate() - dow);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // showPace inlines the pace text rather than leaving it only in the
  // title= tooltip — the day popover needs it visible on touch, where
  // tooltips never fire; the calendar's compact pill keeps it tooltip-only.
  // opts.link renders the row as a link to the activity detail page — only
  // the popover call site sets it; the calendar cell and mobile week card
  // own their own click handler on the whole day, so a nested anchor there
  // would fight it.
  function runLine(r, opts) {
    const color = TYPE_COLOR[r.run_type] ?? 'var(--muted)';
    const titleParts = [esc(r.name ?? '')];
    if (r.pace_min_per_mile != null) titleParts.push(`${fmt.pace(r.pace_min_per_mile)}/mi`);
    const title = titleParts.join(' · ');
    const paceInline = opts && opts.showPace && r.pace_min_per_mile != null ? ` · ${fmt.pace(r.pace_min_per_mile)}/mi` : '';
    const typeInline = opts && opts.showType ? ` · ${SLOT_LABEL[runSlot(r.run_type)]}` : '';
    const main = `<span class="cal-dot" style="background:${color}"></span><span>${r.distance_mi.toFixed(1)} mi${paceInline}${typeInline}</span>`;
    if (opts && opts.link) {
      return `<a class="cal-run day-popover-run" href="/activity.html?id=${r.activity_id}" title="${title}">
        <span class="day-popover-run-main">${main}</span>
        <span class="day-popover-run-arrow">&rarr;</span>
      </a>`;
    }
    return `<div class="cal-run" title="${title}">${main}</div>`;
  }

  // A synced run's planned-slot equivalent.
  const runSlot = t => t === 'long_run' ? 'long' : t === 'workout' || t === 'race' ? t : 'easy';

  // A rest day carries no number line regardless of whether target_miles is
  // NULL or an explicit 0 — either way there's nothing to lead with.
  function isRestSlot(day) {
    return day.slot === 'rest' && !day.title && (day.target_miles == null || day.target_miles === 0);
  }

  // Two-line chip: the number (mi or duration) leads, bold and slot-colored,
  // and never truncates; the title/slot label follows, smaller and muted,
  // ellipsized if it has to. One call per session on a multi-session day —
  // callers stack the returned chips, they never collapse to one.
  function plannedSlot(day) {
    if (!day) return '';
    const glyph = day.terrain === 'trail' ? TRAIL_GLYPH : '';
    if (isRestSlot(day)) {
      return `<div class="plan-slot slot-rest">Rest${glyph}</div>`;
    }
    const label = day.title ? esc(day.title) : SLOT_LABEL[day.slot] ?? day.slot;
    const num = day.target_miles != null ? `${trimMiles(day.target_miles)} mi`
      : day.target_minutes != null ? fmtDuration(day.target_minutes)
      : null;
    const extras = [];
    if (day.target_miles != null) extras.push(`${day.target_miles.toFixed(1)}mi`);
    if (day.target_minutes != null) extras.push(fmtDuration(day.target_minutes));
    const titleAttr = `${label}${extras.length ? ' · ' + extras.join(' · ') : ''}`;
    return `<div class="plan-slot slot-${day.slot}" title="${esc(titleAttr)}">
      ${num != null ? `<div class="plan-slot-num">${esc(num)}</div>` : ''}
      <div class="plan-slot-label">${label}${glyph}</div>
    </div>`;
  }

  function logMarker(entries) {
    if (!entries || !entries.length) return '';
    const title = entries.map(e => `${e.action}${e.reason ? ': ' + e.reason : ''}`).join(' · ');
    return `<div class="cal-log-marker" title="${esc(title)}"></div>`;
  }

  function dayCell(dateStr, dayByDate, actualByDate, logByDate, runOpts) {
    const sessions = dayByDate.get(dateStr) ?? [];
    const runs = actualByDate.get(dateStr) ?? [];
    const logs = logByDate.get(dateStr) ?? [];
    const dayNum = Number(dateStr.slice(8, 10));
    return `<div class="cal-day" data-plan-date="${dateStr}">
      ${logMarker(logs)}
      <div class="cal-daynum">${dayNum}</div>
      ${sessions.length ? sessions.map(plannedSlot).join('') : plannedSlot(null)}
      ${runs.map(r => runLine(r, runOpts)).join('')}
    </div>`;
  }

  function bandChip(band) {
    if (!band) return '';
    return `<div class="band-chip" style="background:${BAND_COLOR[band]}" title="${BAND_LABEL[band]}">${band}</div>`;
  }

  function weekRow(week, dayByDate, actualByDate, logByDate, runOpts) {
    const days = Array.from({ length: 7 }, (_, i) => addDays(week.week_start, i));
    return `<div class="${week.is_current ? 'cal-row current' : 'cal-row'}">
      ${days.map(d => dayCell(d, dayByDate, actualByDate, logByDate, runOpts)).join('')}
    </div>`;
  }

  // -----------------------------------------------------------------------
  // Mobile calendar — a week's days as full-width rows, below 784px (see the
  // .cal-cards media query). Independently rendered from weekRow/dayCell
  // rather than reusing their grid-cell markup: a day's content reads as a
  // horizontal row here (weekday, then session number + title, then any
  // synced pill), not a vertically-stacked cell.
  // -----------------------------------------------------------------------

  function weekRangeLabel(weekStart) {
    return `${shortDate(weekStart)} – ${shortDate(addDays(weekStart, 6))}`;
  }

  function mobileSessionHTML(day) {
    const glyph = day.terrain === 'trail' ? TRAIL_GLYPH : '';
    const label = day.title ? esc(day.title) : (SLOT_LABEL[day.slot] ?? day.slot);
    const num = day.target_miles != null ? `${trimMiles(day.target_miles)} mi`
      : day.target_minutes != null ? fmtDuration(day.target_minutes)
      : null;
    const color = SLOT_COLOR[day.slot] ?? 'var(--muted)';
    return `<div class="mcal-slot">
      ${num != null ? `<span class="mcal-slot-num" style="color:${color}">${esc(num)}</span>` : ''}
      <span class="mcal-slot-label">${label}${glyph}</span>
    </div>`;
  }

  function mobileDayRowHTML(dateStr, dayByDate, actualByDate, logByDate) {
    const sessions = dayByDate.get(dateStr) ?? [];
    const runs = actualByDate.get(dateStr) ?? [];
    const logs = logByDate.get(dateStr) ?? [];
    const wd = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' });
    const dayNum = Number(dateStr.slice(8, 10));
    const rest = !sessions.length || sessions.every(isRestSlot);
    const body = rest
      ? `<div class="mcal-rest">Rest</div>`
      : sessions.map(mobileSessionHTML).join('');
    return `<div class="mcal-day-row${rest ? ' rest' : ''}" data-plan-date="${dateStr}">
      ${logMarker(logs)}
      <div class="mcal-day-wd">${wd}<span class="mcal-daynum">${dayNum}</span></div>
      <div class="mcal-day-body">
        ${body}
        ${runs.map(r => runLine(r)).join('')}
      </div>
    </div>`;
  }

  function weekCardMobileHTML(week, dayByDate, actualByDate, logByDate) {
    const days = Array.from({ length: 7 }, (_, i) => addDays(week.week_start, i));
    return `<div class="${week.is_current ? 'mcal-week current' : 'mcal-week'}">
      ${days.map(d => mobileDayRowHTML(d, dayByDate, actualByDate, logByDate)).join('')}
    </div>`;
  }

  // -----------------------------------------------------------------------
  // Goals — see adr/0007. Weekly goals: a chip per calendar week and a strip
  // of weekly marks; cycle goals: progress text.
  // -----------------------------------------------------------------------

  const GOAL_UNIT = { weekly_miles: 'mi', element_sessions: 'runs', tagged_runs: 'runs', run_kind: 'runs', activity_days: 'days' };

  function goalChipsHTML(goals, weekStart) {
    const chips = (goals?.goals ?? []).filter(g => g.horizon === 'weekly').map(g => {
      const w = g.weeks.find(x => x.week_start === weekStart);
      if (!w) return '';
      const text = w.value == null ? `${g.key} ${trimMiles(w.target)}` : `${g.key} ${trimMiles(w.value)}/${trimMiles(w.target)}`;
      return `<span class="goal-chip${w.met === false ? ' missed' : ''}">${esc(text)}</span>`;
    }).join('');
    return chips ? `<div class="cwk-goals">${chips}</div>` : '';
  }

  function goalProgressText(g) {
    const unit = GOAL_UNIT[g.type], p = g.progress;
    const span = g.from_week || g.to_week ? ` (${g.from_week ? shortDate(g.from_week) : 'start'} – ${g.to_week ? shortDate(g.to_week) : 'end'})` : '';
    const left = p.left ? ` · ${p.left} week${p.left === 1 ? '' : 's'} left` : '';
    if (g.aggregate === 'weeks_at_least') {
      return `${trimMiles(p.so_far)} of ${trimMiles(g.target)} weeks ≥ ${trimMiles(g.threshold)} ${unit}${span}${left}${!p.met && !p.reachable ? ' · out of reach' : ''}`;
    }
    return `avg ${p.so_far == null ? '—' : trimMiles(p.so_far)} of ${trimMiles(g.target)} ${unit}/wk${span}${left}`;
  }

  function renderGoals(goals) {
    if (!goals || !goals.goals.length) return;
    const row = g => {
      const unit = GOAL_UNIT[g.type];
      const weekly = g.horizon === 'weekly';
      const marks = weekly ? `<div class="goal-strip">${g.weeks.map(w =>
        `<span class="goal-mark${w.met == null ? '' : w.met ? ' met' : ' missed'}" title="${esc(`${weekRangeLabel(w.week_start)}: ${w.value == null ? 'not scored' : `${trimMiles(w.value)} of ${trimMiles(w.target)}`}`)}"></span>`).join('')}</div>` : '';
      return `<div class="goal-row">
        <div class="goal-head"><span class="goal-key">${esc(g.key)}</span>
          <span class="goal-target">${weekly ? `≥ ${trimMiles(g.target)} ${unit}/wk` : g.aggregate === 'average' ? `average ≥ ${trimMiles(g.target)} ${unit}/wk` : `${trimMiles(g.target)} weeks ≥ ${trimMiles(g.threshold)} ${unit}`}</span></div>
        <div class="goal-why">${esc(g.why)}</div>
        ${marks}
        ${weekly ? '' : `<div class="goal-progress">${esc(goalProgressText(g))}</div>`}
        ${(g.flags ?? []).map(f => `<div class="goal-flag"><span class="flag-dot"></span><span>${esc(f.message)}</span></div>`).join('')}
      </div>`;
    };
    slotEl('goals').insertAdjacentHTML('beforeend', `
      <section id="section-goals">
        <h2>Goals</h2>
        <p class="desc">This cycle's emphasis · a mark per week (filled: met, red: missed, outline: not scored yet) · cycle goals roll the weeks up</p>
        <div class="goals-panel">${goals.goals.map(row).join('')}</div>
      </section>`);
  }

  // One-line summary of a week: range, phase, miles, long run, workouts, band.
  // Actuals are shown only for the current and past weeks.
  function weekSummaryHTML(week, actualByDate, band, goals) {
    const actual = !week.is_future;
    const runs = Array.from({ length: 7 }, (_, i) => actualByDate.get(addDays(week.week_start, i)) ?? []).flat();
    const miles = actual ? `${week.actual_miles.toFixed(1)} of ${targetMilesLabel(week)} mi` : `${targetMilesLabel(week)} mi`;
    let longRun = '';
    if (week.target_long_run_miles != null) {
      const done = Math.max(0, ...runs.map(r => r.distance_mi));
      longRun = actual ? `Long ${trimMiles(done)} of ${trimMiles(week.target_long_run_miles)}` : `Long ${trimMiles(week.target_long_run_miles)}`;
    } else if (week.target_long_run_minutes != null) {
      longRun = `Long ${fmtDuration(week.target_long_run_minutes)}`;
    }
    const workouts = actual ? `${week.actual_workouts} of ${week.target_workouts} workouts`
      : week.target_workouts ? `${week.target_workouts} workout${week.target_workouts === 1 ? '' : 's'}` : '';
    return `<div class="cwk-head">
        <span>${esc(weekRangeLabel(week.week_start))}</span>
        <span class="tile-sub">${esc(week.phase)}</span>
        ${bandChip(band)}
        <span class="cwk-chev">&rsaquo;</span>
      </div>
      <div class="cwk-line">${[miles, longRun, workouts].filter(Boolean).map(t => `<span>${esc(t)}</span>`).join('')}</div>
      ${goalChipsHTML(goals, week.week_start)}
      ${week.note ? `<div class="cwk-note" title="${esc(week.note)}">${esc(week.note)}</div>` : ''}`;
  }

  // Current week first, then upcoming weeks in order, then past weeks most
  // recent first under a History divider. One week is expanded at a time by
  // the nav; tapping a summary toggles its week independently.
  function renderCalendar(data, bandByWeek, goals) {
    const { weeks, days, actual, log } = data;
    if (!weeks.length) return;

    const dayByDate = groupSessionsByDate(days);
    const actualByDate = new Map(Object.entries(actual ?? {}));
    const logByDate = new Map(Object.entries(log ?? {}));
    const weekdayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const hasBands = bandByWeek && bandByWeek.size > 0;

    const weekHTML = w => `<div class="cwk${w.is_current ? ' current' : ''}" data-week="${w.week_start}">
        <button type="button" class="cwk-sum" aria-expanded="false">${weekSummaryHTML(w, actualByDate, bandByWeek?.get(w.week_start), goals)}</button>
        <div class="cwk-body" hidden>
          <div class="cal">
            <div class="cal-header">${weekdayLabels.map(d => `<div class="cal-hcell">${d}</div>`).join('')}</div>
            ${weekRow(w, dayByDate, actualByDate, logByDate)}
          </div>
          <div class="cal-cards">${weekCardMobileHTML(w, dayByDate, actualByDate, logByDate)}</div>
        </div>
      </div>`;
    const past = weeks.filter(w => !w.is_current && !w.is_future).reverse();
    const ordered = [...weeks.filter(w => w.is_current), ...weeks.filter(w => w.is_future)];

    const section = slotEl('calendar');
    section.insertAdjacentHTML('beforeend', `
      <section id="section-calendar">
        <h2>Calendar</h2>
        <p class="desc">Dashed chip is the planned slot, colored by type · filled pill is the synced run · dot marker is a plan_log note · ▲ marks a trail day · tap a week to expand it, tap a day for detail${hasBands ? ' · colored chip is the completed week’s adherence band' : ''}</p>
        <div class="cal-nav">
          <button type="button" class="filter-btn" data-week-nav="-1">&lsaquo; Prev</button>
          <button type="button" class="filter-btn" data-week-nav="0">This week</button>
          <button type="button" class="filter-btn" data-week-nav="1">Next &rsaquo;</button>
        </div>
        ${ordered.map(weekHTML).join('')}
        ${past.length ? `<div class="cal-divider">History</div>${past.map(weekHTML).join('')}` : ''}
        <div class="cal-legend">
          <span><span class="cal-dot" style="background:var(--muted)"></span>Easy</span>
          <span><span class="cal-dot" style="background:var(--series-8)"></span>Workout</span>
          <span><span class="cal-dot" style="background:var(--series-1)"></span>Long run</span>
          <span><span class="cal-dot" style="background:var(--good)"></span>Race</span>
          <span><span class="cal-dot" style="background:var(--series-5)"></span>Strength</span>
          <span>▲ Trail</span>
          <span><span class="cal-log-marker" style="position:static;display:inline-block;margin-right:0.3125rem"></span>Log note</span>
        </div>
      </section>`);

    const currentIdx = weeks.findIndex(w => w.is_current);
    let navIdx = currentIdx >= 0 ? currentIdx : (weeks[0].is_future ? 0 : weeks.length - 1);
    const weekEl = i => section.querySelector(`.cwk[data-week="${weeks[i].week_start}"]`);
    const setOpen = (el, open) => {
      el.querySelector('.cwk-sum').setAttribute('aria-expanded', String(open));
      el.querySelector('.cwk-body').hidden = !open;
    };
    const refreshNav = () => {
      section.querySelector('[data-week-nav="-1"]').disabled = navIdx <= 0;
      section.querySelector('[data-week-nav="1"]').disabled = navIdx >= weeks.length - 1;
      section.querySelector('[data-week-nav="0"]').disabled = currentIdx < 0;
    };
    const goTo = i => {
      setOpen(weekEl(navIdx), false);
      navIdx = i;
      setOpen(weekEl(i), true);
      refreshNav();
      weekEl(i).scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    };
    setOpen(weekEl(navIdx), true);
    refreshNav();
    section.addEventListener('click', e => {
      const nav = e.target.closest('[data-week-nav]');
      if (nav) {
        const step = Number(nav.dataset.weekNav);
        goTo(step === 0 ? currentIdx : navIdx + step);
        return;
      }
      const sum = e.target.closest('.cwk-sum');
      if (!sum) return;
      const el = sum.closest('.cwk');
      const open = sum.getAttribute('aria-expanded') !== 'true';
      setOpen(el, open);
      if (open) { navIdx = weeks.findIndex(w => w.week_start === el.dataset.week); refreshNav(); }
    });
  }

  // -----------------------------------------------------------------------
  // Flags panel — renders nothing at all when there are no active
  // flags. Silence is the common case by design: patterns are rare and
  // flags only fire on 2+ consecutive completed weeks, never a single miss.
  // -----------------------------------------------------------------------

  function renderFlags(adherence) {
    if (!adherence || !adherence.flags || !adherence.flags.length) return;

    slotEl('flags').insertAdjacentHTML('beforeend', `
      <section id="section-flags">
        <h2>Flags</h2>
        <p class="desc">Patterns only — 2+ consecutive completed weeks, never a single day or week</p>
        <div class="flags-panel">
          ${adherence.flags.map(f => `
            <div class="flag-item">
              <span class="flag-dot"></span>
              <span>${esc(f.message)}</span>
            </div>`).join('')}
        </div>
      </section>`);
  }

  // -----------------------------------------------------------------------
  // Easy HR/pace progression — two stacked mini-charts (pace, HR) over
  // the same continuous plan-window x-axis rather than one dual-axis chart:
  // pace and HR are different units/scales, and this codebase never puts two
  // y-scales on one chart (see training.html's fitness chart / weekly-history
  // chart, both single-axis). Apparent temperature is a tooltip-only
  // annotation, not a plotted line — context, not a third scale.
  // -----------------------------------------------------------------------

  function renderProgressionEasy(progression) {
    if (!progression || !progression.weeks.length) return;
    const { weeks, easy, captions } = progression;

    slotEl('easy').insertAdjacentHTML('beforeend', `
      <section id="section-progression-easy">
        <h2>Easy HR/pace progression</h2>
        <p class="desc">Distance-weighted average over each week's easy runs · gaps are weeks with no easy run synced · hover for average apparent temperature · heat-adjusted corrects each run to cool conditions (temperature + dew point); click the legend to toggle</p>
        <div style="display:flex;gap:1rem;flex-wrap:wrap">
          <div style="flex:1;min-width:280px">
            <div class="subchart-label">Pace</div>
            <div class="chart-wrap-small"><div id="chart-easy-pace" style="width:100%;height:100%"></div></div>
          </div>
          <div style="flex:1;min-width:280px">
            <div class="subchart-label">Heart rate</div>
            <div class="chart-wrap-small"><div id="chart-easy-hr" style="width:100%;height:100%"></div></div>
          </div>
        </div>
        ${captions && captions.easy ? `<p class="chart-caption">${esc(captions.easy)}</p>` : ''}
        ${easy.some(e => e.weather_attribution) ? '<p class="weather-credit">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></p>' : ''}
      </section>`);

    const theme = chartTheme();
    const paceData = weeks.map((ws, i) => [ws, easy[i].avg_pace_min_per_mile]);
    const paceAdjData = weeks.map((ws, i) => [ws, easy[i].avg_pace_heat_adj_min_per_mile]);
    const hrData = weeks.map((ws, i) => [ws, easy[i].avg_hr]);

    function tooltipFor(params) {
      const i = params[0].dataIndex;
      const e = easy[i];
      if (!e) return '';
      const parts = [];
      if (e.avg_pace_min_per_mile != null) parts.push(`Pace: ${fmt.pace(e.avg_pace_min_per_mile)}/mi`);
      if (e.avg_pace_heat_adj_min_per_mile != null && e.avg_pace_heat_adj_min_per_mile !== e.avg_pace_min_per_mile) {
        parts.push(`Heat-adjusted: ${fmt.pace(e.avg_pace_heat_adj_min_per_mile)}/mi`);
      }
      if (e.avg_hr != null) parts.push(`HR: ${e.avg_hr}`);
      if (e.avg_apparent_temp_f != null) parts.push(`Feels like: ${Math.round(e.avg_apparent_temp_f)}°F`);
      parts.push(`${e.run_count} easy run${e.run_count === 1 ? '' : 's'}`);
      return `<div style="font-weight:600;margin-bottom:2px;color:${theme.text}">${shortDate(e.week_start)}</div>${parts.join('<br>')}`;
    }

    function baseOption(name, data, extraYAxis) {
      return {
        animation: false,
        grid: { top: 16, right: 20, bottom: 28, left: 48 },
        tooltip: {
          trigger: 'axis',
          backgroundColor: theme.surface,
          borderColor: theme.gridline,
          textStyle: { fontSize: 12, color: theme.text },
          formatter: tooltipFor,
        },
        xAxis: {
          type: 'time',
          axisLine: { lineStyle: { color: theme.gridline } },
          axisTick: { show: false },
          axisLabel: { fontSize: 10, color: theme.muted },
          ...(theme.compact ? { splitNumber: 4 } : {}),
        },
        yAxis: Object.assign({
          type: 'value',
          axisLine: { show: false },
          axisTick: { show: false },
          splitLine: { lineStyle: { color: theme.gridline } },
          axisLabel: { fontSize: 10, color: theme.muted },
        }, extraYAxis),
        series: [{
          name,
          type: 'line',
          data,
          connectNulls: false,
          showSymbol: true,
          symbolSize: 6,
          lineStyle: { color: theme.series[0], width: 2 },
          itemStyle: { color: theme.series[0] },
        }],
      };
    }

    const paceChart = echarts.init(document.getElementById('chart-easy-pace'));
    const paceOption = baseOption('Easy pace', paceData, { inverse: true, axisLabel: { fontSize: 10, color: theme.muted, formatter: fmt.pace } });
    paceOption.series.push({
      name: 'Heat-adjusted',
      type: 'line',
      data: paceAdjData,
      connectNulls: false,
      showSymbol: true,
      symbolSize: 5,
      lineStyle: { color: theme.series[1], width: 1.5, type: 'dashed' },
      itemStyle: { color: theme.series[1] },
    });
    paceOption.legend = { top: 0, right: 0, textStyle: { fontSize: 10, color: theme.muted }, itemWidth: 14, itemHeight: 8 };
    paceOption.grid = { ...paceOption.grid, top: 28 };
    paceChart.setOption(paceOption);
    TAB_CHARTS.trends.push(paceChart);

    const hrChart = echarts.init(document.getElementById('chart-easy-hr'));
    hrChart.setOption(baseOption('Easy HR', hrData, {}));
    TAB_CHARTS.trends.push(hrChart);

    window.addEventListener('resize', () => { paceChart.resize(); hrChart.resize(); });
  }

  // -----------------------------------------------------------------------
  // Workout pace progression — one dot per matched workout vs its
  // frozen target band (drawn as a floating bar: an invisible base stacked
  // under a visible range, ECharts' standard "range bar" idiom), with
  // fitness_checkpoints' monthly 5K pace as a subtle background reference
  // line, per training.html's checkpoint treatment but deliberately muted
  // here — it's context, not the headline.
  // -----------------------------------------------------------------------

  function renderProgressionWorkouts(progression) {
    if (!progression || !progression.weeks.length) return;
    const { weeks, workouts, checkpoints, captions } = progression;

    // Target bands come from plan versions — the plan-independent
    // /api/progression payload has none, so don't advertise them.
    const hasBands = workouts.some(w => w.pace_lo != null && w.pace_hi != null);
    slotEl('workouts').insertAdjacentHTML('beforeend', `
      <section id="section-progression-workouts">
        <h2>Workout pace progression</h2>
        <p class="desc">Each dot is one synced workout's work-lap pace${hasBands ? ' · shaded band is its frozen target range' : ''} · dashed line is monthly 5K-pace fitness context</p>
        <div class="chart-wrap"><div id="chart-workouts" style="width:100%;height:100%"></div></div>
        <div class="chart-legend">
          ${hasBands ? `<span class="legend-swatch"><span class="legend-box" style="background:${withAlpha(cssVar('--muted'), 0.35)}"></span>Target band</span>` : ''}
          <span class="legend-swatch"><span class="legend-box" style="background:${cssVar('--series-8')}"></span>Actual pace</span>
          <span class="legend-swatch"><span class="legend-line"></span>5K fitness (monthly)</span>
        </div>
        ${captions && captions.workouts ? `<p class="chart-caption">${esc(captions.workouts)}</p>` : ''}
      </section>`);

    const theme = chartTheme();
    const withBand = workouts.filter(w => w.pace_lo != null && w.pace_hi != null);
    const bandBase = withBand.map(w => [w.date, w.pace_lo]);
    const bandRange = withBand.map(w => [w.date, w.pace_hi - w.pace_lo]);
    const dotData = workouts
      .filter(w => w.pace_min_per_mile != null)
      .map(w => ({
        value: [w.date, w.pace_min_per_mile],
        meta: w,
        itemStyle: { color: theme.series[7] },
      }));
    const checkpointData = (checkpoints ?? [])
      .filter(c => c.pace_5k != null)
      .map(c => [`${c.month}-01`, c.pace_5k]);

    const rangeStart = weeks[0];
    const rangeEnd = addDays(weeks[weeks.length - 1], 6);

    // The invisible band-base bar anchors the value axis at 0, which squashes
    // 6–7 min/mi paces into a sliver — pin the axis to the data extent
    // (half-minute snapped) instead.
    const paceVals = [
      ...withBand.flatMap(w => [w.pace_lo, w.pace_hi]),
      ...dotData.map(d => d.value[1]),
      ...checkpointData.map(c => c[1]),
    ];
    const paceExtent = paceVals.length
      ? { min: Math.floor((Math.min(...paceVals) - 0.25) * 2) / 2, max: Math.ceil((Math.max(...paceVals) + 0.25) * 2) / 2 }
      : {};

    const chart = echarts.init(document.getElementById('chart-workouts'));
    TAB_CHARTS.trends.push(chart);
    chart.setOption({
      animation: false,
      grid: { top: 24, right: 24, bottom: 32, left: 48 },
      tooltip: {
        trigger: 'item',
        backgroundColor: theme.surface,
        borderColor: theme.gridline,
        textStyle: { fontSize: 12, color: theme.text },
        formatter(params) {
          if (params.seriesName === '5K fitness') {
            return `<div style="font-weight:600;color:${theme.text}">${params.value[0].slice(0, 7)}</div>5K pace: ${fmt.pace(params.value[1])}/mi`;
          }
          const w = params.data && params.data.meta;
          if (!w) return '';
          const band = w.pace_lo != null && w.pace_hi != null ? `${fmt.pace(w.pace_lo)}–${fmt.pace(w.pace_hi)}/mi` : 'no target band';
          return `<div style="font-weight:600;margin-bottom:2px;color:${theme.text}">${shortDate(w.date)}${w.title ? ' · ' + esc(w.title) : ''}</div>
            Actual: ${fmt.pace(w.pace_min_per_mile)}/mi<br>
            Target: ${band}`;
        },
      },
      xAxis: {
        type: 'time',
        min: rangeStart,
        max: rangeEnd,
        axisLine: { lineStyle: { color: theme.gridline } },
        axisTick: { show: false },
        axisLabel: { fontSize: 11, color: theme.muted },
        ...(theme.compact ? { splitNumber: 4 } : {}),
      },
      yAxis: {
        type: 'value',
        inverse: true,
        name: 'min/mi',
        nameLocation: 'middle',
        nameGap: 40,
        nameTextStyle: { fontSize: 11, color: theme.muted },
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { lineStyle: { color: theme.gridline } },
        axisLabel: { fontSize: 11, color: theme.muted, formatter: fmt.pace },
        ...paceExtent,
      },
      series: [
        {
          name: 'band-base',
          type: 'bar',
          stack: 'band',
          data: bandBase,
          barWidth: 14,
          itemStyle: { color: 'transparent' },
          silent: true,
          tooltip: { show: false },
          z: 1,
        },
        {
          name: 'Target band',
          type: 'bar',
          stack: 'band',
          data: bandRange,
          barWidth: 14,
          itemStyle: { color: withAlpha(theme.muted, 0.35) },
          silent: true,
          tooltip: { show: false },
          z: 1,
        },
        {
          name: '5K fitness',
          type: 'line',
          data: checkpointData,
          showSymbol: true,
          symbolSize: 4,
          lineStyle: { color: theme.muted, width: 1.5, type: 'dashed', opacity: 0.6 },
          itemStyle: { color: theme.muted, opacity: 0.6 },
          z: 2,
        },
        {
          name: 'Actual pace',
          type: 'scatter',
          data: dotData,
          symbolSize: 9,
          z: 3,
        },
      ],
    });
    window.addEventListener('resize', () => chart.resize());
  }

  // -----------------------------------------------------------------------
  // Recent weekly mileage + fitness stat strip — the two Trends sections
  // that render identically in every plan state (unlike the two chart above,
  // which read either /api/plan-progression's plan-scoped window or
  // /api/progression's rolling one depending on state, these two are always
  // plan-independent). A plain bar chart of the last 16 weeks from
  // /api/weekly-history — no bands, no ramp line, just "what actually
  // happened" — and a one-line current-fitness caption reusing whatever
  // checkpoints the progression payload already fetched, rather than a third
  // network request.
  // -----------------------------------------------------------------------

  const RECENT_MILEAGE_WEEKS = 16;
  const LOAD_WEEKS = 9; // ~2 months

  function renderLoad(loadData) {
    slotEl('load').insertAdjacentHTML('beforeend', `
      <section id="section-load">
        <h2>Load</h2>
        <p class="desc">Last 2 months · acute:chronic ratio — 7-day TRIMP load ÷ the 28-day weekly average · shaded: under 0.8 low, 0.8–1.3 optimal, 1.3–1.5 caution, over 1.5 high · population heuristics, not a diagnosis</p>
        <div class="chart-wrap-small"><div id="chart-acwr" style="width:100%;height:100%"></div></div>
        <div class="subchart-label" style="margin-top:0.75rem">Monotony (over 2 = little day-to-day variation)</div>
        <div class="chart-wrap-small"><div id="chart-monotony" style="width:100%;height:100%"></div></div>
        <p class="chart-caption" id="load-caption"></p>
      </section>`);
    const caption = document.getElementById('load-caption');
    if (loadData.note || !loadData.days.length) { caption.textContent = loadData.note ?? ''; return; }
    const { charts, captionText } = renderLoadCharts(
      document.getElementById('chart-acwr'), document.getElementById('chart-monotony'), loadData);
    caption.textContent = captionText;
    TAB_CHARTS.trends.push(...charts);
    window.addEventListener('resize', () => charts.forEach(c => c.resize()));
  }

  function renderRecentMileage(weeklyHistory) {
    if (!weeklyHistory || !weeklyHistory.weeks.length) return;
    const weeks = weeklyHistory.weeks.slice(-RECENT_MILEAGE_WEEKS);

    slotEl('mileage').insertAdjacentHTML('beforeend', `
      <section id="section-recent-mileage">
        <h2>Recent weekly mileage</h2>
        <p class="desc">Last ${weeks.length} weeks of synced running, zero-filled for weeks with no runs</p>
        <div class="chart-wrap"><div id="chart-recent-mileage" style="width:100%;height:100%"></div></div>
      </section>`);

    const theme = chartTheme();
    const chart = echarts.init(document.getElementById('chart-recent-mileage'));
    TAB_CHARTS.trends.push(chart);
    chart.setOption({
      animation: false,
      grid: { top: 16, right: 24, bottom: 32, left: 48 },
      tooltip: {
        trigger: 'axis',
        backgroundColor: theme.surface,
        borderColor: theme.gridline,
        textStyle: { fontSize: 12, color: theme.text },
        formatter(params) {
          const w = weeks[params[0].dataIndex];

      xAxis: {
        type: 'time',
        axisLine: { lineStyle: { color: theme.gridline } },

        ...(theme.compact ? { splitNumber: 4 } : {}),
      },
      yAxis: {
        type: 'value',
        name: 'Miles',
        nameLocation: 'middle',
        nameGap: 34,
        nameTextStyle: { fontSize: 11, color: theme.muted },
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { lineStyle: { color: theme.gridline } },
        axisLabel: { fontSize: 11, color: theme.muted },

      series: [{
        name: 'Miles',
