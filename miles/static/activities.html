<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miles · Activities</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .activities-view h1 {
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }
    .activities-view .subtitle { font-size: 0.8125rem; color: var(--muted); margin-bottom: 1.25rem; }
    .activities-view .activities-empty { font-size: 0.8125rem; color: var(--muted); padding: 1rem 0; }
    .activities-view .dense tbody td { padding: 0.25rem 0.75rem; font-size: 0.75rem; }
    .activities-view .dense thead th { padding: 0.375rem 0.75rem; font-size: 0.625rem; }
    .activities-view .entity-link { color: inherit; text-decoration: none; }
    .activities-view .entity-link:hover { text-decoration: underline; }
    .activities-view .run-type { font-size: 0.6875rem; color: var(--muted); text-transform: capitalize; }

    /* Phones: each row is a card (name + type, then the figures on one
       wrapped line), the whole card tapping through to the activity. The
       table layout returns at 640px. */
    .activities-view .act-table thead { display: none; }
    .activities-view .act-table, .activities-view .act-table tbody { display: block; }
    .activities-view .act-table tr {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.125rem 0.625rem;
      padding: 0.625rem 0.875rem;
      border-bottom: 1px solid var(--gridline);
    }
    .activities-view .act-table tr:last-child { border-bottom: none; }
    .activities-view .act-table tbody td {
      padding: 0;
      border: none;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: left;
    }
    .activities-view .act-table td.act-name {
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }
    .activities-view .act-table td.act-type { order: 1; }
    /* Line break between the name row and the figures row. */
    .activities-view .act-table tr::before { content: ""; order: 2; flex-basis: 100%; }
    .activities-view .act-table td.act-date, .activities-view .act-table td.act-fig { order: 3; }
    .activities-view .act-table tbody td.dash { display: none; }
    .activities-view .act-table .entity-link::after { content: ""; position: absolute; inset: 0; }
    @media (min-width: 640px) {
      .activities-view .act-table { display: table; }
      .activities-view .act-table tbody { display: table-row-group; }
      .activities-view .act-table thead { display: table-header-group; }
      .activities-view .act-table tr { position: static; display: table-row; padding: 0; border: none; }
      .activities-view .act-table tr::before { content: none; }
      .activities-view .act-table .act-unit { display: none; }
      .activities-view .act-table tbody td {
        display: table-cell;
        padding: 0.25rem 0.75rem;
        border-bottom: 1px solid var(--gridline);
        color: var(--text-secondary);
      }
      .activities-view .act-table tbody td.act-name { overflow: visible; font-size: 0.75rem; font-weight: 400; color: var(--text-secondary); }
      .activities-view .act-table tbody td.r { text-align: right; }
      .activities-view .act-table tbody td.dash { display: table-cell; text-align: right; color: var(--baseline); }
      .activities-view .act-table tbody tr:last-child td { border-bottom: none; }
      .activities-view .act-table .entity-link::after { content: none; }
    }

    .activities-view .load-more-row { text-align: center; padding: 1rem 0; }
    .activities-view .load-more-btn {
      font-size: 0.8125rem;
      font-weight: 600;
      width: 100%;
      min-height: 2.75rem;
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .activities-view .load-more-btn:hover { background: var(--pr-bg-hover); }
    .activities-view .load-more-btn:disabled { opacity: 0.5; cursor: default; }
    @media (min-width: 640px) {
      .activities-view .load-more-btn { width: auto; min-height: 0; font-size: 0.75rem; }
    }

    /* Filters. Phones: full-width buttons, the type list a bottom sheet above
       the tab bar and the date range a bottom-sheet dialog; from 640px a
       popover and a centered dialog. */
    .activities-view .filter-bar { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .activities-view .filter-bar > .filter-btn, .activities-view .type-filter { flex: 1 1 0; min-width: 0; }
    .activities-view .type-filter { position: relative; display: flex; }
    .activities-view .type-filter > .filter-btn { flex: 1 1 auto; }
    .filter-btn, .primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      min-width: 0;
      min-height: 2.75rem;
      padding: 0 0.875rem;
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .filter-btn:hover { background: var(--pr-bg-hover); }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); }
    .filter-btn .filter-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .filter-btn .chev { width: 0.75rem; height: 0.75rem; flex: none; }
    .primary-btn { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .link-btn {
      min-height: 2.75rem;
      padding: 0 0.25rem;
      font: inherit;
      font-size: 0.8125rem;
      border: none;
      background: none;
      color: var(--accent);
      cursor: pointer;
    }

    .type-backdrop { position: fixed; inset: 0; z-index: 89; background: rgba(0, 0, 0, 0.35); }
    .type-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
      z-index: 90;
      display: flex;
      flex-direction: column;
      max-height: 70vh;
      padding: 0.5rem;
      background: var(--surface);
      color: var(--text);
      border-top: 1px solid var(--border);
      border-radius: 12px 12px 0 0;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.12);
    }
    .type-panel[hidden], .type-backdrop[hidden] { display: none; }
    /* Only the options scroll: the head and Done stay in view. */
    #type-options { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .type-panel .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.75rem;
      font-size: 0.8125rem;
      font-weight: 600;
    }
    .type-row-wrap { display: flex; align-items: center; }
    .type-row {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      gap: 0.625rem;
      min-height: 2.75rem;
      padding: 0 0.75rem;
      border-radius: 6px;
      font-size: 0.9375rem;
      cursor: pointer;
    }
    .type-row:active { background: var(--bg); }
    .type-row input { width: 1.125rem; height: 1.125rem; margin: 0; accent-color: var(--accent); }
    .type-row .count { margin-left: auto; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .type-sub { padding-left: 1.75rem; }
    .type-sub[hidden] { display: none; }
    .type-expand {
      flex: none;
      width: 2.75rem;
      height: 2.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }
    .type-expand[hidden] { display: none; }
    .type-expand svg { width: 0.875rem; height: 0.875rem; transform: rotate(-90deg); transition: transform 0.15s; }
    .type-expand[aria-expanded="true"] svg { transform: none; }
    .panel-done { flex: none; width: 100%; margin-top: 0.5rem; }

    .date-dialog {
      margin: auto 0 0;
      width: 100%;
      max-width: 100%;
      padding: 0;
      border: none;
      border-radius: 12px 12px 0 0;
      background: var(--surface);
      color: var(--text);
    }
    .date-dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
    .date-inner { padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px)); }
    .date-head { display: flex; align-items: center; justify-content: space-between; }
    .date-year { font-size: 1rem; font-weight: 650; font-variant-numeric: tabular-nums; }
    .year-nav {
      width: 2.75rem;
      height: 2.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .year-nav svg { width: 0.875rem; height: 0.875rem; }
    .year-nav:disabled { opacity: 0.35; cursor: default; }
    .date-hint { min-height: 1.25rem; margin: 0.5rem 0; font-size: 0.75rem; color: var(--muted); text-align: center; }
    .month-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.375rem; }
    .month-btn {
      min-height: 2.75rem;
      font: inherit;
      font-size: 0.875rem;
      border: 1px solid transparent;
      border-radius: 6px;
      background: none;
      color: var(--text);
      cursor: pointer;
    }
    .month-btn:hover:not(:disabled) { border-color: var(--border); }
    .month-btn:disabled { color: var(--baseline); cursor: default; }
    .month-btn.in-range { background: color-mix(in srgb, var(--accent) 15%, transparent); }
    .month-btn.edge { background: var(--accent); color: #fff; font-weight: 600; }
    .date-foot { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; }
    .date-foot .spacer { flex: 1; }

    @media (min-width: 640px) {
      .activities-view .filter-bar > .filter-btn, .activities-view .type-filter { flex: none; }
      .filter-btn, .primary-btn { min-height: 2rem; font-size: 0.75rem; }
      .activities-view .filter-bar .filter-btn { max-width: 16rem; }
      .link-btn { min-height: 2rem; font-size: 0.75rem; }
      .type-backdrop { display: none; }
      .type-panel {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: auto;
        bottom: auto;
        z-index: 20;
        width: 16rem;
        max-height: 26rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
      .type-row { min-height: 2rem; font-size: 0.8125rem; }
      .type-expand { width: 2rem; height: 2rem; }
      .panel-done { display: none; }
      .date-dialog { margin: auto; width: 20rem; border: 1px solid var(--border); border-radius: 10px; }
      .date-inner { padding: 1rem; }
      .year-nav { width: 2rem; height: 2rem; }
      .month-btn { min-height: 2.25rem; font-size: 0.8125rem; }
    }
  </style>
</head>
<body>
<script src="/nav.js"></script>
<script src="/charts.js"></script>

<main class="activities-view">
  <h1>Activities</h1>
  <p class="subtitle" id="subtitle">Loading…</p>

  <div id="section-activities" style="display:none">
    <div class="filter-bar">
      <button type="button" class="filter-btn" id="date-btn" aria-haspopup="dialog">
        <span class="filter-label" id="date-label">All dates</span>
      </button>
      <div class="type-filter" id="type-filter">
        <button type="button" class="filter-btn" id="type-btn" aria-haspopup="true" aria-expanded="false" aria-controls="type-panel">
          <span class="filter-label" id="type-label">All types</span>
          <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <div class="type-panel" id="type-panel" role="group" aria-label="Activity types" hidden>
          <div class="panel-head">
            <span>Types</span>
            <button type="button" class="link-btn" id="type-clear">All types</button>
          </div>
          <div id="type-options"></div>
          <button type="button" class="primary-btn panel-done" id="type-done">Done</button>
        </div>
      </div>
    </div>

    <div class="scroll dense">
      <table class="act-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Type</th>
            <th class="r">Distance</th>
            <th class="r">Time</th>
            <th class="r">Pace</th>
            <th class="r">Avg HR</th>
          </tr>
        </thead>
        <tbody id="body-activities"></tbody>
      </table>
    </div>
    <p class="activities-empty" id="no-match" style="display:none">No activities match these filters.</p>
    <div class="load-more-row">
      <button class="load-more-btn" id="load-more">Load more</button>
    </div>
  </div>

  <p class="activities-empty" id="empty" style="display:none">No activities synced yet.</p>
</main>

<div class="type-backdrop" id="type-backdrop" hidden></div>

<dialog class="date-dialog" id="date-dialog" aria-labelledby="date-year">
  <div class="date-inner">
    <div class="date-head">
      <button type="button" class="year-nav" id="year-prev" aria-label="Previous year">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 3l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <span class="date-year" id="date-year"></span>
      <button type="button" class="year-nav" id="year-next" aria-label="Next year">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 3l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <p class="date-hint" id="date-hint"></p>
    <div class="month-grid" id="month-grid"></div>
    <div class="date-foot">
      <button type="button" class="link-btn" id="date-clear">All dates</button>
      <span class="spacer"></span>
      <button type="button" class="filter-btn" id="date-cancel">Cancel</button>
      <button type="button" class="primary-btn" id="date-apply">Apply</button>
    </div>
  </div>
</dialog>

<script>
  const PAGE_SIZE = 50;
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  let offset = 0;
  let loading = false;
  let reqId = 0;
  let filters = null;  // /api/activity-filters
  // Empty sports = every type. runTypes narrows Run only; it holds every
  // run type while Run is selected unfiltered, and Run leaves `sports` when
  // it empties.
  const state = { sports: new Set(), runTypes: new Set(), from: null, to: null };

  function td(val, cls = 'r') {
    if (val == null) return `<td class="dash">—</td>`;
    return `<td class="${cls}">${val}</td>`;
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g,
      ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  // "RockClimbing" -> "Rock climbing"
  function sportLabel(sport) {
    const words = String(sport ?? 'Other').replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase();
    return words.charAt(0).toUpperCase() + words.slice(1);
  }

  // "long_run" -> "Long run"
  function runTypeLabel(t) {
    const words = String(t).replace(/_/g, ' ');
    return words.charAt(0).toUpperCase() + words.slice(1);
  }

  function monthLabel(key) {
    const [y, m] = key.split('-');
    return `${MONTHS[Number(m) - 1]} ${y}`;
  }

  function rangeLabel(from, to) {
    return from === to ? monthLabel(from) : `${monthLabel(from)} – ${monthLabel(to)}`;
  }

  function renderRows(rows) {
    const body = document.getElementById('body-activities');
    body.insertAdjacentHTML('beforeend', rows.map(r => `
      <tr>
        <td class="act-date">${esc(r.start_date ? r.start_date.slice(0, 10) : '—')}</td>
        <td class="act-name">${r.is_run
          ? `<a class="entity-link" href="/activity.html?id=${r.id}">${esc(r.name ?? 'Untitled')}</a>`
          : esc(r.name ?? 'Untitled')}</td>
        <td class="act-type"><span class="run-type">${esc(r.is_run ? r.run_type : sportLabel(r.sport_type))}</span></td>
        ${td(r.distance_mi != null ? `${r.distance_mi.toFixed(2)} mi` : null, 'r act-fig')}
        ${td(fmt.time(r.moving_time_s), 'r act-fig')}
        ${td(r.pace_min_per_mile != null ? `${fmt.pace(r.pace_min_per_mile)}/mi` : null, 'r act-fig')}
        ${td(r.avg_hr != null ? `${r.avg_hr}<span class="act-unit"> bpm</span>` : null, 'r act-fig')}
      </tr>
    `).join(''));
  }

  function filterParams() {
    const p = new URLSearchParams();
    for (const s of state.sports) p.append('sport', s);
    if (state.sports.has('Run') && state.runTypes.size < filters.run_types.length) {
      for (const t of state.runTypes) p.append('run_type', t);
    }
    if (state.from) p.set('from_month', state.from);
    if (state.to) p.set('to_month', state.to);
    return p;
  }

  // reset: start over from the first page under the current filters; a
  // newer reset discards an older one still in flight.
  async function loadPage(reset = false) {
    if (loading && !reset) return;
    const id = reset ? ++reqId : reqId;
    loading = true;
    const btn = document.getElementById('load-more');
    btn.disabled = true;
    btn.textContent = 'Loading…';

    try {
      const p = filterParams();
      p.set('offset', reset ? 0 : offset);
      p.set('limit', PAGE_SIZE);
      const res = await fetch(`/api/activities-list?${p}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const page = await res.json();
      if (id !== reqId) return;

      if (reset) {
        document.getElementById('body-activities').innerHTML = '';
        offset = 0;
      }
      renderRows(page.rows);
      offset += page.rows.length;
      document.getElementById('no-match').style.display = offset === 0 ? '' : 'none';
      btn.style.display = page.has_more ? '' : 'none';
    } finally {
      if (id === reqId) {
        loading = false;
        btn.disabled = false;
        btn.textContent = 'Load more';
      }
    }
  }

  function reload() {
    saveFilters();
    loadPage(true).catch(showError);
  }

  // ---- Remembered filters ------------------------------------------------
  // Per viewer, in localStorage. runTypes is saved as null when Run is
  // unfiltered, so a run type that appears later is still included.

  const FILTERS_KEY = 'miles.activityFilters';

  function saveFilters() {
    const runFiltered = state.sports.has('Run') && state.runTypes.size < filters.run_types.length;
    const saved = {
      sports: [...state.sports],
      runTypes: runFiltered ? [...state.runTypes] : null,
      from: state.from,
      to: state.to,
    };
    try { localStorage.setItem(FILTERS_KEY, JSON.stringify(saved)); } catch { /* not remembered */ }
  }

  // Drops anything the current data no longer has (a sport since deleted, a
  // malformed range) rather than restoring a filter that can't be shown.
  function restoreFilters() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(FILTERS_KEY) || 'null'); } catch { /* storage unavailable */ }
    if (!saved || typeof saved !== 'object') return;

    const sports = new Set(filters.sports.map(s => s.sport_type));
    const runTypes = filters.run_types.map(t => t.run_type);
    if (Array.isArray(saved.sports)) state.sports = new Set(saved.sports.filter(s => sports.has(s)));
    if (state.sports.has('Run')) {
      const kept = Array.isArray(saved.runTypes) ? saved.runTypes.filter(t => runTypes.includes(t)) : [];
      state.runTypes = new Set(kept.length ? kept : runTypes);
    }

    const month = /^\d{4}-\d{2}$/;
    if (month.test(saved.from) && month.test(saved.to) && saved.from <= saved.to) {
      state.from = saved.from;
      state.to = saved.to;
    }
  }

  function showError(err) {
    document.getElementById('subtitle').textContent = `Error: ${err.message}`;
  }

  // ---- Type filter -------------------------------------------------------

  const typePanel = document.getElementById('type-panel');
  const typeBackdrop = document.getElementById('type-backdrop');
  const typeBtn = document.getElementById('type-btn');

  function buildTypeOptions() {
    const runSub = filters.run_types.map(t => `
      <label class="type-row">
        <input type="checkbox" data-run-type="${esc(t.run_type)}">
        <span>${esc(runTypeLabel(t.run_type))}</span>
        <span class="count">${t.count}</span>
      </label>`).join('');
    document.getElementById('type-options').innerHTML = filters.sports.map(s => {
      const isRun = s.sport_type === 'Run' && filters.run_types.length > 0;
      return `
      <div class="type-row-wrap">
        <label class="type-row">
          <input type="checkbox" data-sport="${esc(s.sport_type)}">
          <span>${esc(sportLabel(s.sport_type))}</span>
          <span class="count">${s.count}</span>
        </label>
        ${isRun ? `<button type="button" class="type-expand" id="run-expand" aria-expanded="false" aria-controls="run-sub" aria-label="Run types" hidden>
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>` : ''}
      </div>
      ${isRun ? `<div class="type-sub" id="run-sub" hidden>${runSub}</div>` : ''}`;
    }).join('');
  }

  function syncTypeUI() {
    const runPartial = state.sports.has('Run') && state.runTypes.size < filters.run_types.length;
    for (const box of typePanel.querySelectorAll('[data-sport]')) {
      box.checked = state.sports.has(box.dataset.sport);
      box.indeterminate = box.dataset.sport === 'Run' && runPartial;
    }
    for (const box of typePanel.querySelectorAll('[data-run-type]')) {
      box.checked = state.sports.has('Run') && state.runTypes.has(box.dataset.runType);
    }
    const expand = document.getElementById('run-expand');
    if (expand) {
      expand.hidden = !state.sports.has('Run');
      if (expand.hidden) setRunExpanded(false);
    }

    let label = 'All types';
    if (state.sports.size === 1) {
      const [only] = state.sports;
      label = sportLabel(only);
      if (only === 'Run' && runPartial) label += `: ${[...state.runTypes].map(runTypeLabel).join(', ').toLowerCase()}`;
    } else if (state.sports.size > 1) {
      label = `${state.sports.size} types`;
    }
    document.getElementById('type-label').textContent = label;
    typeBtn.classList.toggle('active', state.sports.size > 0);
  }

  function setRunExpanded(open) {
    const expand = document.getElementById('run-expand');
    if (!expand) return;
    expand.setAttribute('aria-expanded', String(open));
    document.getElementById('run-sub').hidden = !open;
  }

  function setTypeOpen(open) {
    typePanel.hidden = !open;
    typeBackdrop.hidden = !open;
    typeBtn.setAttribute('aria-expanded', String(open));
  }

  typePanel.addEventListener('change', e => {
    const box = e.target;
    if (box.dataset.sport) {
      const sport = box.dataset.sport;
      if (box.checked) {
        state.sports.add(sport);
        if (sport === 'Run') state.runTypes = new Set(filters.run_types.map(t => t.run_type));
      } else {
        state.sports.delete(sport);
        if (sport === 'Run') state.runTypes.clear();
      }
    } else if (box.dataset.runType) {
      if (box.checked) state.runTypes.add(box.dataset.runType);
      else state.runTypes.delete(box.dataset.runType);
      if (state.runTypes.size === 0) state.sports.delete('Run');
    } else {
      return;
    }
    syncTypeUI();
    if (box.dataset.sport === 'Run' && box.checked) setRunExpanded(true);
    reload();
  });

  typePanel.addEventListener('click', e => {
    const expand = e.target.closest('#run-expand');
    if (expand) setRunExpanded(expand.getAttribute('aria-expanded') !== 'true');
  });

  typeBtn.addEventListener('click', () => setTypeOpen(typePanel.hidden));
  typeBackdrop.addEventListener('click', () => setTypeOpen(false));
  document.getElementById('type-done').addEventListener('click', () => setTypeOpen(false));
  document.getElementById('type-clear').addEventListener('click', () => {
    if (state.sports.size === 0) return;
    state.sports.clear();
    state.runTypes.clear();
    syncTypeUI();
    reload();
  });
  document.addEventListener('click', e => {
    if (!typePanel.hidden && !document.getElementById('type-filter').contains(e.target) && e.target !== typeBackdrop) {
      setTypeOpen(false);
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !typePanel.hidden) {
      setTypeOpen(false);
      typeBtn.focus();
    }
  });

  // ---- Date range --------------------------------------------------------

  const dateDialog = document.getElementById('date-dialog');
  const draft = { from: null, to: null, year: null };

  function yearBounds() {
    return [Number(filters.first_month.slice(0, 4)), Number(filters.last_month.slice(0, 4))];
  }

  function renderMonthGrid() {
    const [minYear, maxYear] = yearBounds();
    document.getElementById('date-year').textContent = draft.year;
    document.getElementById('year-prev').disabled = draft.year <= minYear;
    document.getElementById('year-next').disabled = draft.year >= maxYear;

    const hi = draft.to ?? draft.from;
    document.getElementById('month-grid').innerHTML = MONTHS.map((name, i) => {
      const key = `${draft.year}-${String(i + 1).padStart(2, '0')}`;
      const outside = key < filters.first_month || key > filters.last_month;
      const cls = ['month-btn'];
      if (draft.from && key >= draft.from && key <= hi) cls.push('in-range');
      if (key === draft.from || key === draft.to) cls.push('edge');
      return `<button type="button" class="${cls.join(' ')}" data-month="${key}"${outside ? ' disabled' : ''}>${name}</button>`;
    }).join('');

    document.getElementById('date-hint').textContent =
      !draft.from ? 'Select a start month'
      : !draft.to ? `${monthLabel(draft.from)} – select an end month, or Apply for one month`
      : rangeLabel(draft.from, draft.to);
  }

  function syncDateUI() {
    document.getElementById('date-label').textContent = state.from ? rangeLabel(state.from, state.to) : 'All dates';
    document.getElementById('date-btn').classList.toggle('active', state.from != null);
  }

  document.getElementById('date-btn').addEventListener('click', () => {
    draft.from = state.from;
    draft.to = state.to;
    draft.year = Number((state.to ?? filters.last_month).slice(0, 4));
    renderMonthGrid();
    dateDialog.showModal();
  });

  document.getElementById('month-grid').addEventListener('click', e => {
    const btn = e.target.closest('[data-month]');
    if (!btn || btn.disabled) return;
    const key = btn.dataset.month;
    if (!draft.from || draft.to) {
      draft.from = key;
      draft.to = null;
    } else if (key < draft.from) {
      draft.to = draft.from;
      draft.from = key;
    } else {
      draft.to = key;
    }
    renderMonthGrid();
  });

  document.getElementById('year-prev').addEventListener('click', () => { draft.year--; renderMonthGrid(); });
  document.getElementById('year-next').addEventListener('click', () => { draft.year++; renderMonthGrid(); });
  document.getElementById('date-cancel').addEventListener('click', () => dateDialog.close());
  // A click on the dialog element itself (not its inner panel) is a backdrop click.
  dateDialog.addEventListener('click', e => { if (e.target === dateDialog) dateDialog.close(); });

  function applyDates(from, to) {
    dateDialog.close();
    if (from === state.from && to === state.to) return;
    state.from = from;
    state.to = to;
    syncDateUI();
    reload();
  }
  document.getElementById('date-apply').addEventListener('click', () => {
    applyDates(draft.from, draft.from ? (draft.to ?? draft.from) : null);
  });
  document.getElementById('date-clear').addEventListener('click', () => applyDates(null, null));

  // ---- Init --------------------------------------------------------------

  document.getElementById('load-more').addEventListener('click', () => loadPage().catch(showError));

  (async () => {
    const res = await fetch('/api/activity-filters');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    filters = await res.json();
    if (!filters.sports.length) {
      document.getElementById('subtitle').textContent = 'No activities synced yet.';
      document.getElementById('empty').style.display = '';
      return;
    }
    restoreFilters();
    buildTypeOptions();
    syncTypeUI();
    syncDateUI();
    await loadPage(true);
    document.getElementById('subtitle').textContent = 'All synced activities, newest first.';
    document.getElementById('section-activities').style.display = '';
  })().catch(showError);
</script>
</body>
</html>
