  function renderFitnessStrip(progression) {
    const checkpoints = (progression && progression.checkpoints || []).filter(c => c.pace_5k != null);
    if (!checkpoints.length) return;
    const latest = checkpoints[checkpoints.length - 1];
    slotEl('fitness').insertAdjacentHTML('beforeend', `
      <p class="chart-caption">Current 5K-pace fitness: ${fmt.pace(latest.pace_5k)}/mi as of ${shortDate(`${latest.month}-01`)}
      · <a class="readiness-link" href="/training.html">Fitness chart →</a></p>`);
  }

  // -----------------------------------------------------------------------
  // Version history
  // -----------------------------------------------------------------------

  const diffCache = new Map(); // "a:b" -> VersionDiff

  const DIFF_FIELD_LABEL = {
    race_date: 'race date', distance_bucket: 'distance', goal_time_s: 'goal time',
    target_miles: 'target miles', target_workouts: 'workouts', target_long_run_miles: 'long run',
    phase: 'phase', note: 'note', slot: 'slot', title: 'title', target_json: 'workout target',
  };
  function diffFieldLabel(f) { return DIFF_FIELD_LABEL[f] ?? f; }

  const RACE_VALUE = {
    race_date: v => shortDate(v) + ' ' + v.slice(0, 4),
    distance_bucket: distLabel,
    goal_time_s: v => fmt.time(v),
  };
  function raceDiffRow([field, [a, b]]) {
    const show = v => (v == null ? 'none' : RACE_VALUE[field](v));
    return `<div class="diff-week">
      <div class="diff-week-start">Race</div>
      <div class="diff-tag changed">changed</div>
      <div class="diff-fields">${diffFieldLabel(field)}: ${esc(show(a))} → ${esc(show(b))}</div>
    </div>`;
  }

  function diffWeekRow(w) {
    return `<div class="diff-week">
      <div class="diff-week-start">${shortDate(w.week_start)}</div>
      <div class="diff-tag ${w.change}">${w.change}</div>
      <div class="diff-fields">${w.changed_fields.length ? w.changed_fields.map(diffFieldLabel).join(', ') : ''}</div>
    </div>`;
  }

  async function loadDiff(a, b) {
    const key = `${a}:${b}`;
    if (diffCache.has(key)) return diffCache.get(key);
    const res = await fetch(`/api/plan-diff?a=${a}&b=${b}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const diff = await res.json();
    diffCache.set(key, diff);
    return diff;
  }

  async function toggleDiff(panel, prevId, curId) {
    const isOpen = panel.classList.contains('open');
    if (isOpen) {
      panel.classList.remove('open');
      return;
    }
    panel.classList.add('open');
    if (panel.dataset.loaded) return;
    panel.innerHTML = `<p class="diff-empty">Loading…</p>`;
    try {
      const diff = await loadDiff(prevId, curId);
      panel.dataset.loaded = '1';
      const race = Object.entries(diff.changed_race);
      panel.innerHTML = race.length || diff.changed_weeks.length
        ? race.map(raceDiffRow).join('') + diff.changed_weeks.map(diffWeekRow).join('')
        : `<p class="diff-empty">No week-level changes between these versions.</p>`;
    } catch (err) {
      panel.innerHTML = `<p class="diff-empty">Error loading diff: ${esc(err.message)}</p>`;
    }
  }

  function versionItem(v, prev) {
    const dateStr = v.created_at.slice(0, 10);
    const toggle = prev ? `<span class="version-toggle">vs v${prev.version_n} ▾</span>` : '';
    return `
      <div class="version-item">
        <div class="version-head" data-version-id="${v.version_id}" data-prev-id="${prev ? prev.version_id : ''}">
          <span class="version-tag">v${v.version_n}${v.committed_at ? '' : ' draft'}</span>
          <span class="version-date">${shortDate(dateStr)}</span>
          <span class="version-author">${esc(v.author)}</span>
          <span class="version-note">${esc(v.note ?? '')}</span>
          ${toggle}
        </div>
        <div class="version-diff" id="diff-${v.version_id}"></div>
      </div>`;
  }

  function renderVersions(versions) {
    if (!versions.length) return;
    // Newest first for display; each item (but the first/original) can expand
    // a diff against the version immediately before it. The header carries a
    // latest-version annotation — the plan's current authorship state, read
    // at a glance without scanning the list.
    const ordered = [...versions].reverse();
    const latest = ordered[0];
    const annot = `<span class="version-annot">v${latest.version_n} · ${esc(latest.author)} · revised ${shortDate(latest.created_at.slice(0, 10))}</span>`;
    slotEl('versions').insertAdjacentHTML('beforeend', `
      <section id="section-versions">
        <h2>Version history${annot}</h2>
        <p class="desc">Every revision is a full snapshot · click a version with a note to see which weeks changed</p>
        <div class="version-list">
          ${ordered.map((v, i) => versionItem(v, ordered[i + 1])).join('')}
        </div>
      </section>`);

    document.querySelectorAll('.version-head').forEach(head => {
      head.addEventListener('click', () => {
        const prevId = head.dataset.prevId;
        if (!prevId) return;
        const panel = document.getElementById(`diff-${head.dataset.versionId}`);
        toggleDiff(panel, Number(prevId), Number(head.dataset.versionId));
      });
    });
  }

  // -----------------------------------------------------------------------
  // Today view — one kicker line, then the two-card at-a-glance grid (see
  // plan_api.py's _today_blocks for how week_so_far/vs_last_week are
  // computed: both pro-rate/cut off by planned days and the sync cutoff
  // server-side, so this rendering layer only formats what's already there).
  // -----------------------------------------------------------------------

  const wdDate = d => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).replace(',', '');

  function kickerHTML(dateStr, parts, syncedThrough) {
    const synced = syncedThrough ? ` <span class="kicker-sub">· synced through ${shortDate(syncedThrough)}</span>` : '';
    return `<div class="today-kicker">${[wdDate(dateStr), ...parts].join(' · ')}${synced}</div>`;
  }

  function todayKickerHTML(data) {
    const { plan, today } = data;
    const days = plan.race_date
      ? Math.round((new Date(plan.race_date + 'T00:00:00') - new Date(today.date + 'T00:00:00')) / 86400000) : -1;
    const when = days === 0 ? 'Race day' : days === 1 ? 'Race tomorrow' : `Race in ${days} days`;
    const race = days < 0 ? [] : days === 0 ? [when] : [when, `${distLabel(plan.distance_bucket)} ${wdDate(plan.race_date)}`];
    return kickerHTML(today.date, race, data.synced_through);
  }

  // The card's hero is the first non-strength session (strength supplements
  // a run, it doesn't lead the card); falls back to the first session when
  // every session that day is strength.
  function heroSession(sessions) {
    return sessions.find(d => d.slot !== 'strength') ?? sessions[0] ?? null;
  }

  // One compact line per session beyond the hero — same idiom as the
  // "Up next" footer line (colored dot + title + target), not a second
  // full session card.
  function alsoTodayLineHTML(day) {
    const glyph = day.terrain === 'trail' ? TRAIL_GLYPH : '';
    const label = day.title ? esc(day.title) : (SLOT_LABEL[day.slot] ?? day.slot);
    const extras = [];
    if (day.target_miles != null) extras.push(`${day.target_miles.toFixed(1)} mi`);
    if (day.target_minutes != null) extras.push(fmtDuration(day.target_minutes));
    return `<div class="today-next-line">
      <span class="cal-dot" style="background:${SLOT_COLOR[day.slot] ?? 'var(--muted)'}"></span>
      <span>${label}${glyph}${extras.length ? ` · ${extras.join(' · ')}` : ''}</span>
    </div>`;
  }

  function alsoTodayHTML(others) {
    if (!others.length) return '';
    return `<div class="today-done"><div class="panel-label">Also today</div>${others.map(alsoTodayLineHTML).join('')}</div>`;
  }

  function todaySessionHTML(data) {
    const { today } = data;
    if (!today || !today.week_start) {
      return `<div class="today-card"><p class="desc" style="margin:0">Outside the plan window.</p></div>`;
    }
    const sessions = today.sessions ?? [];
    const hero = heroSession(sessions);
    const others = sessions.filter(d => d !== hero);
    const dateLine = `<div class="panel-label">Today · ${new Date(today.date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</div>`;
    const parts = [dateLine];
    if (!hero || hero.slot === 'rest') {
      parts.push(`<div class="today-rest">Rest day.</div>`);
      if (hero && hero.note) parts.push(`<p class="today-note">${esc(hero.note)}</p>`);
    } else {
      const glyph = hero.terrain === 'trail' ? TRAIL_GLYPH : '';
      const label = hero.title ? esc(hero.title) : (SLOT_LABEL[hero.slot] ?? hero.slot);
      parts.push(`<div class="today-slot" style="color:${SLOT_COLOR[hero.slot] ?? 'var(--text)'}">${esc(SLOT_LABEL[hero.slot] ?? hero.slot)}</div>`);
      parts.push(`<div class="today-title">${label}${glyph}</div>`);
      const lines = describeDayTarget(hero);
      if (lines.length) {
        // First line is the session itself ("6.0 mi", "8–10 × 3:00 @ …") —
        // it gets display size; the rest stay secondary.
        parts.push(`<div class="today-targets">${lines.map((l, i) => `<div${i === 0 ? ' class="target-lead"' : ''}>${esc(l)}</div>`).join('')}</div>`);
      }
      parts.push(stepsHTML(hero));
      if (hero.note) parts.push(`<p class="today-note">${esc(hero.note)}</p>`);
      parts.push(whyHTML(hero));
    }
    parts.push(alsoTodayHTML(others));
    // Undated documents cover the whole plan, so Today always lists them.
    const docs = [...docsOn(PLAN_DATA.docs, today.date), ...PLAN_DATA.docs.filter(d => !d.start_date)];
    if (docs.length) parts.push(`<div class="today-docs">${docs.map(d => `📄 ${docLinkHTML(d)}`).join(' · ')}</div>`);
    parts.push(todaySyncedHTML(today.date));
    parts.push(upNextHTML(today.date));
    return `<div class="today-card" data-plan-date="${today.date}">${parts.join('')}</div>`;
  }

  // Today's synced run(s) right under the prescription — actual miles and
  // pace beside the target answers "did I hit it" without opening anything.
  function todaySyncedHTML(todayStr) {
    const runs = PLAN_DATA.actualByDate.get(todayStr) ?? [];
    if (!runs.length) return '';
    const lines = runs.map(r => {
      const bits = [`${r.distance_mi.toFixed(1)} mi`];
      if (r.pace_min_per_mile != null) bits.push(`${fmt.pace(r.pace_min_per_mile)}/mi`);
      return `<div class="today-next-line" title="${esc(r.name ?? '')}">
        <span class="cal-dot" style="background:${TYPE_COLOR[r.run_type] ?? 'var(--muted)'}"></span>
        <span>${bits.join(' · ')}</span>
      </div>`;
    }).join('');
    return `<div class="today-done"><div class="panel-label">Synced today</div>${lines}</div>`;
  }

  // "+ strength" / "+ 2nd run" — a compact suffix naming what else is on
  // the date, never a second full line.
  function sessionSuffixWord(s, primary) {
    if (s.slot === primary.slot && s.slot !== 'strength' && s.slot !== 'rest') return '2nd run';
    return (SLOT_LABEL[s.slot] ?? s.slot).toLowerCase();
  }

  // Tomorrow's primary slot as the card's footer, plus a compact suffix
  // when tomorrow carries more than one session — clicking it opens
  // tomorrow's popover (the inner data-plan-date wins via closest()).
  function upNextHTML(todayStr) {
    const tomorrow = addDays(todayStr, 1);
    const sessions = PLAN_DATA.dayByDate.get(tomorrow) ?? [];
    if (!sessions.length) return '';
    const primary = heroSession(sessions);
    const others = sessions.filter(d => d !== primary);
    const wd = new Date(tomorrow + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long' });
    const glyph = primary.terrain === 'trail' ? TRAIL_GLYPH : '';
    const label = primary.title ? esc(primary.title) : (SLOT_LABEL[primary.slot] ?? primary.slot);
    const extras = [];
    if (primary.target_miles != null) extras.push(`${primary.target_miles.toFixed(1)} mi`);
    if (primary.target_minutes != null) extras.push(fmtDuration(primary.target_minutes));
    const suffix = others.length === 1 ? ` · + ${sessionSuffixWord(others[0], primary)}`
      : others.length > 1 ? ` · + ${others.length} more` : '';
    return `
      <div class="today-next" data-plan-date="${tomorrow}">
        <div class="panel-label">Up next · ${wd}</div>
        <div class="today-next-line">
          <span class="cal-dot" style="background:${SLOT_COLOR[primary.slot] ?? 'var(--muted)'}"></span>
          <span>${label}${glyph}${extras.length ? ` · ${extras.join(' · ')}` : ''}${suffix}</span>
        </div>
      </div>`;
  }

  // The chip's big number is always miles (the runner's unit): actual run
  // miles once the day has data, planned miles (or duration) ahead of it,
  // "0" for an elapsed planned day with nothing synced — hit/missed reads
  // straight off the row. The done-fill means "a run synced", never just
  // "the date passed". On a multi-session day the number sums target_miles
  // across every non-rest session (an 8+4 double reads "12"); color/label
  // follow the first non-strength session.
  const scheduledOn = dateStr => (PLAN_DATA.dayByDate.get(dateStr) ?? []).filter(d => d.slot !== 'rest');
  const plannedMilesOf = scheduled => scheduled.reduce((s, d) => s + (d.target_miles ?? 0), 0);

  function dayChip(dateStr, todayStr) {
    const sessions = PLAN_DATA.dayByDate.get(dateStr) ?? [];
    const runs = PLAN_DATA.actualByDate.get(dateStr) ?? [];
    const primary = heroSession(sessions);
    const slot = primary ? primary.slot : 'rest';
    const color = SLOT_COLOR[slot] ?? 'var(--muted)';
    const stateClass = [
      runs.length ? 'done' : '',
      dateStr === todayStr ? 'today' : dateStr > todayStr ? 'upcoming' : '',
    ].filter(Boolean).join(' ');
    const glyph = primary && primary.terrain === 'trail' ? TRAIL_GLYPH : '';
    const label = primary ? (SLOT_LABEL[primary.slot] ?? primary.slot) : 'Rest';
    const wd = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' });

    const scheduled = scheduledOn(dateStr);
    const milesTotal = plannedMilesOf(scheduled);
    const hasMiles = scheduled.some(d => d.target_miles != null);
    const minutesOnly = !hasMiles ? scheduled.find(d => d.target_minutes != null) : undefined;
    const plannedNum = hasMiles ? trimMiles(milesTotal)
      : minutesOnly ? fmtDuration(minutesOnly.target_minutes)
      : null;

    const ranMi = runs.reduce((s, r) => s + r.distance_mi, 0);
    const num = runs.length ? trimMiles(ranMi)
      : dateStr < todayStr ? (slot === 'rest' ? '—' : '0')
      : plannedNum ?? (slot === 'rest' ? '—' : '·');

    const titleParts = sessions.length
      ? sessions.map(d => {
          const dl = d.title ? d.title : (SLOT_LABEL[d.slot] ?? d.slot);
          const dNum = d.target_miles != null ? `${trimMiles(d.target_miles)} mi` : d.target_minutes != null ? fmtDuration(d.target_minutes) : null;
          return dNum ? `${dl} (${dNum})` : dl;
        })
      : ['Rest'];
    if (runs.length) titleParts.push(`ran ${trimMiles(ranMi)} mi`);
    return `<div class="day-chip ${stateClass}" style="--chip-color:${color}" data-plan-date="${dateStr}" title="${esc(titleParts.join(' · '))}">
      <div class="day-chip-wd">${wd}</div>
      <div class="day-chip-num">${num}</div>
      <div class="day-chip-slot">${esc(label)}${glyph}</div>
    </div>`;
  }

  function weekCardHTML(data) {
    const { today, week_so_far } = data;
    if (!today || !today.week_start) {
      return `<div class="week-card"><p class="desc" style="margin:0">Outside the plan window.</p></div>`;
    }
    const days = Array.from({ length: 7 }, (_, i) => addDays(today.week_start, i));
    const chips = days.map(d => dayChip(d, today.date)).join('');
    const ws = week_so_far;
    const started = ws && ws.week_started;
    const headline = !started ? '' : ws.target_miles == null
      ? `${ws.actual_workouts_so_far} of ${ws.target_workouts} workouts`
      : `${ws.actual_miles_so_far.toFixed(1)} of ${targetMilesLabel(ws)} mi`;
    const progress = !ws ? ''
      : !started ? `<p class="week-shape">Sync hasn't reached this week yet.</p>`
      : `<p class="week-shape">${esc(leftLine(ws))}</p>`;
    return `
      <div class="week-card">
        <div class="week-card-head">
          <span class="panel-label">This week${ws ? ` · ${esc(ws.phase)}` : ''}</span>
          ${headline ? `<span class="week-headline">${esc(headline)}</span>` : ''}
        </div>
        <div class="day-chip-row">${chips}</div>
        ${ws && ws.note ? `<p class="week-note-line" title="${esc(ws.note)}">${esc(ws.note)}</p>` : ''}
        ${progress}
        <div class="week-divider"></div>
        ${vsLastWeekHTML(data, true)}
      </div>`;
  }

  // Cumulative miles over Mon–Sun: last week in full (muted), this week
  // through the cutoff (accent), and, with a plan, the planned week in full
  // (dashed). Dots mark each line at the cutoff day; their labels sit beside
  // the dots and are pushed apart vertically so they never overlap.
  function cumulativeLinesSVG(vw, plannedDaily) {
    const W = 300, H = 84, x0 = 12, x1 = 288, yTop = 16, yBot = 62, labelGap = 12;
    const cutoff = vw.cutoff_offset;
    const cum = (arr, n) => { let t = 0; return arr.slice(0, n).map(v => (t += v)); };
    const lastPts = cum(vw.days.map(d => d.last_week_miles), 7);
    const thisPts = cum(vw.days.map(d => d.miles), cutoff + 1);
    const planPts = plannedDaily ? cum(plannedDaily, 7) : [];
    const maxVal = Math.max(0.1, ...lastPts, ...thisPts, ...planPts);
    const X = i => x0 + (i * (x1 - x0)) / 6;
    const Y = v => yBot - (v / maxVal) * (yBot - yTop);
    const path = pts => pts.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
    const dots = [
      { v: thisPts[cutoff], r: 4, fill: 'var(--accent)', text: 'var(--accent)', tip: `This week through ${shortDate(vw.days[cutoff].date)}` },
      { v: lastPts[cutoff], r: 3, fill: 'var(--muted)', text: 'var(--text-secondary)', tip: `Last week through ${shortDate(vw.days[cutoff].last_week_date)}`, opacity: 0.7 },
    ];
    if (plannedDaily) dots.push({ v: planPts[cutoff], r: 3, fill: 'var(--muted)', text: 'var(--text-secondary)', tip: `Plan through ${shortDate(vw.days[cutoff].date)}` });
    const byY = dots.slice().sort((a, b) => Y(a.v) - Y(b.v));
    byY.forEach((d, i) => { d.ly = Math.max(Y(d.v) + 4, i ? byY[i - 1].ly + labelGap : -Infinity); });
    for (let i = byY.length - 2; i >= 0; i--) byY[i].ly = Math.min(byY[i].ly, byY[i + 1].ly - labelGap);
    const end = cutoff >= 5;
    const marks = dots.map(d => `
      <circle cx="${X(cutoff).toFixed(1)}" cy="${Y(d.v).toFixed(1)}" r="${d.r}" fill="${d.fill}" fill-opacity="${d.opacity ?? 1}"><title>${d.tip}: ${d.v.toFixed(1)} mi</title></circle>
      <text x="${(X(cutoff) + (end ? -7 : 7)).toFixed(1)}" y="${d.ly.toFixed(1)}" text-anchor="${end ? 'end' : 'start'}" font-size="11" fill="${d.text}" stroke="var(--surface)" stroke-width="3" paint-order="stroke">${d.v.toFixed(1)}</text>`).join('');
    const weekdays = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((w, i) =>
      `<text x="${X(i).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--muted)">${w}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative miles, this week against last week${plannedDaily ? ' and the plan' : ''}">
      <line x1="${x0}" x2="${x1}" y1="${yBot}" y2="${yBot}" stroke="var(--gridline)"/>
      ${plannedDaily ? `<path d="${path(planPts)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round"/>` : ''}
      <path d="${path(lastPts)}" fill="none" stroke="var(--muted)" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
      <path d="${path(thisPts)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
      ${marks}
      ${weekdays}
    </svg>`;
  }

  // `planned` adds the plan line and the "vs plan" figure; the dashboard,
  // with no plan behind it, passes nothing.
  function vsLastWeekHTML(data, planned) {
    const vw = data.vs_last_week;
    if (!vw) {
      return `
        <div class="week-card-head"><span class="panel-label">vs last week at this point</span></div>
        <p class="week-shape">Not enough synced data this week yet to compare.</p>`;
    }
    const signed = v => `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}`;
    const plannedDaily = planned ? vw.days.map(d => plannedMilesOf(scheduledOn(d.date))) : null;
    const hasPlan = plannedDaily?.some(m => m > 0);
    const ws = data.week_so_far;
    const vsPlan = hasPlan && ws?.expected_miles_by_now != null
      ? ` · <small>vs plan</small> ${signed(ws.actual_miles_so_far - ws.expected_miles_by_now)}` : '';
    return `
      <div class="week-card-head">
        <span class="panel-label">Cumulative miles</span>
        <span class="week-headline"><small>vs last week</small> ${signed(vw.delta_miles)}${vsPlan}</span>
      </div>
      <div class="vs-row">
        <div class="vs-chart-wrap">${cumulativeLinesSVG(vw, hasPlan ? plannedDaily : null)}</div>
        <div class="chart-legend">
          <span class="legend-swatch"><span class="legend-box" style="background:var(--accent)"></span>This week</span>
          ${hasPlan ? `<span class="legend-swatch"><span class="legend-line"></span>Plan</span>` : ''}
          <span class="legend-swatch"><span class="legend-box" style="background:var(--muted);opacity:0.55"></span>Last week</span>
        </div>
      </div>`;
  }

  // -----------------------------------------------------------------------
  // Today dashboard — the Today tab's content whenever there's no active
  // plan to show targets against (a completed-only plan, or none at all).
  // Actual-only: synced runs as direct links, and a week-so-far card built
  // purely from /api/today's numbers — no targets, or ramp, since
  // there's nothing to compare against. See PLAN_DATA construction in the
  // load orchestrator: actualByDate merges /api/today's actual map on top of
  // any plan's own (a completed plan's window rarely reaches "this week"),
  // so the day-chip popovers below always resolve against fresh data.
  // -----------------------------------------------------------------------

  function dashboardKickerHTML(today) {
    const ws = today.week_so_far;
    return kickerHTML(today.date, [], ws.week_started && ws.week_cutoff_date < today.date ? ws.week_cutoff_date : null);
  }

  // The hero card holds real links to activity detail (runLine's link mode)
  // rather than being itself a popover trigger — unlike the active plan's
  // today-card, which has nothing clickable inside it to conflict with.
  function dashboardTodayCardHTML(today) {
    const runs = today.runs_today;
    const body = runs.length
      ? runs.map(r => runLine(r, { showPace: true, link: true })).join('')
      : `<p class="desc" style="margin:0">No runs synced today yet.</p>`;
    return `
      <div class="today-card" style="cursor:default">
        <div class="panel-label">Synced today</div>
        ${body}
      </div>`;
  }

  // A week-at-a-glance day-chip row with no plan targets behind it — just
  // actual miles per day, reusing the .day-chip markup so it reads the same
  // as the active plan's row. This is the dashboard's popover entry point
  // (each chip carries data-plan-date).
  function dashboardDayChipsHTML(today) {
    const days = Array.from({ length: 7 }, (_, i) => addDays(today.week_start, i));
    return `<div class="day-chip-row">${days.map(d => {
      const runs = PLAN_DATA.actualByDate.get(d) ?? [];
      const wd = new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' });
      const miles = runs.reduce((s, r) => s + r.distance_mi, 0);
      const stateClass = [runs.length ? 'done' : '', d === today.date ? 'today' : d > today.date ? 'upcoming' : ''].filter(Boolean).join(' ');
      const num = runs.length ? trimMiles(miles) : (d < today.date ? '0' : '·');
      return `<div class="day-chip ${stateClass}" style="--chip-color:var(--muted)" data-plan-date="${d}" title="${esc(wd)} ${esc(shortDate(d))}${runs.length ? ` · ${trimMiles(miles)} mi` : ''}">
        <div class="day-chip-wd">${wd}</div>
        <div class="day-chip-num">${num}</div>
        <div class="day-chip-slot">&nbsp;</div>
      </div>`;
    }).join('')}</div>`;
  }

  function dashboardWeekCardHTML(today) {
    const ws = today.week_so_far;
    const parts = [`${ws.actual_miles.toFixed(1)} mi`, `${ws.actual_run_count} run${ws.actual_run_count === 1 ? '' : 's'}`];
    if (ws.actual_workout_count) parts.push(`${ws.actual_workout_count} workout${ws.actual_workout_count === 1 ? '' : 's'}`);
    const headline = ws.week_started ? parts.join(' · ') : '';
    return `
      <div class="week-card">
        <div class="week-card-head">
          <span class="panel-label">This week</span>
          ${headline ? `<span class="week-headline">${esc(headline)}</span>` : ''}
        </div>
        ${dashboardDayChipsHTML(today)}
        ${!ws.week_started ? `<p class="week-shape">Sync hasn't reached this week yet.</p>` : ''}
        <div class="week-divider"></div>
        ${vsLastWeekHTML(today)}
      </div>`;
  }

  function renderTodayDashboard(today) {
    const target = document.getElementById('tab-today');
    if (!target) return;
    target.innerHTML = `
      ${dashboardKickerHTML(today)}
      <div class="today-grid">
        ${dashboardTodayCardHTML(today)}
        ${dashboardWeekCardHTML(today)}
      </div>
      <p class="desc plan-tab-note">No current plan — see the <a href="#plan" data-tab-jump="plan">Plan tab</a>.</p>`;
  }

  function renderToday(data) {
    const target = document.getElementById('tab-today');
    if (!target) return;
    target.innerHTML = `
      ${todayKickerHTML(data)}
      <div class="today-grid">
        ${todaySessionHTML(data)}
        ${weekCardHTML(data)}
      </div>`;
  }

  // -----------------------------------------------------------------------
  // Load + orchestrate
  // -----------------------------------------------------------------------

  // The plan shown on the Plan tab (?plan=<id>); Today and Trends always use
  // the server's default, the current plan by date.
  const QUERY = new URLSearchParams(location.search);
  const SELECTED_PLAN = QUERY.get('plan');
  const DRAFT_VIEW = QUERY.get('draft') === '1';
  // Compare mode (adr/0010): ?plan=A[&draft=1][&weeks=FROM..TO] plus up to three repeated
  // vs=<plan id|actual>[:draft][:FROM..TO]. Replaces the Plan tab's panels.
  const COMPARE = SELECTED_PLAN ? QUERY.getAll('vs').slice(0, 3) : [];

  async function loadPlanApi(path, planId, extra = '') {
    const res = await fetch(planId ? `${path}?plan_id=${planId}${extra}` : path);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail ?? `HTTP ${res.status}`);
    return res.json();
  }

  const loadPlan = (planId, draft) => loadPlanApi('/api/plan', planId, draft ? '&draft=1' : '');
  const loadVersions = () => loadPlanApi('/api/plan-versions', SELECTED_PLAN);
  const loadAdherence = () => loadPlanApi('/api/plan-adherence', SELECTED_PLAN);
  const loadPlans = () => loadPlanApi('/api/plans');

  // The active-plan-scoped chart (frozen target bands, plan-window x-axis)
  // vs the plan-independent rolling one (no bands, last RECENT_MILEAGE_WEEKS
  // weeks) — decided once loadPlan() resolves, since it needs plan status.
  const loadProgression = () => loadPlanApi('/api/plan-progression');

  async function loadProgressionFallback() {
    const res = await fetch(`/api/progression?weeks=${RECENT_MILEAGE_WEEKS}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  const loadGoals = () => loadPlanApi('/api/plan-goals', SELECTED_PLAN);
  const loadRetrospective = () => loadPlanApi('/api/plan-retrospective', SELECTED_PLAN);
  const loadReadiness = () => loadPlanApi('/api/plan-readiness', SELECTED_PLAN);

  async function loadToday() {
    const res = await fetch('/api/today');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  async function loadLoad() {
    const res = await fetch(`/api/load?weeks=${LOAD_WEEKS}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  async function loadWeeklyHistory() {
    const res = await fetch('/api/weekly-history');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  // -----------------------------------------------------------------------
  // Plan tab header, and the All tab's plans table (one /api/plans fetch);
  // its rows link to ?plan=<id>, so the URL always says which plan the tab shows.
  // -----------------------------------------------------------------------

  const ROLE_TAG = { past: 'past', next: 'next', candidate: 'draft', sketch: 'sketch' };

  // The uncommitted version a header shows: a never-committed plan, or the
  // draft view of a committed one.
  const isUncommitted = data => data.version?.committed_at == null;

  function plansTableHTML(plans) {
    const mi = v => v != null ? v.toFixed(1) : '—';
    const row = p => `<tr>
      <td><a class="entity-link" href="?plan=${p.plan_id}#plan">${esc(p.title)}</a></td>
      <td>${p.role}</td>
      <td class="hide-sm">${p.first_week ?? '—'}</td>
      <td class="hide-sm">${p.last_week ?? '—'}</td>
      <td>${p.race ? `${esc(distLabel(p.race.distance_bucket))} ${p.race.date}` : '—'}</td>
      <td class="r">${p.race?.goal_time_s != null ? fmt.time(p.race.goal_time_s) : '—'}</td>
      <td class="r">${p.result_time_s != null ? fmt.time(p.result_time_s) : '—'}</td>
      <td class="r hide-sm">${p.versions}</td>
      <td class="r">${p.adherence ? `${p.adherence.weeks_on_or_close}/${p.adherence.weeks_completed}` : '—'}</td>
      <td class="r hide-sm">${mi(p.peak_target_miles)}</td>
      <td class="r hide-sm">${mi(p.peak_actual_miles)}</td>
    </tr>`;
    return `<div class="scroll dense"><table id="plans-table">
      <thead><tr>
        <th>Plan</th><th>Role</th><th class="hide-sm">First week</th><th class="hide-sm">Last week</th>
        <th>Race</th><th class="r">Goal</th><th class="r">Result</th><th class="r hide-sm">Versions</th>
        <th class="r" title="Scored weeks on or close to plan">On plan</th>
        <th class="r hide-sm" title="Peak target week, miles">Peak plan</th>
        <th class="r hide-sm" title="Peak synced week, miles">Peak run</th>
      </tr></thead>
      <tbody>${plans.map(row).join('')}</tbody>
    </table></div>`;
  }

  function renderDocs(data) {
    if (!data || !data.docs.length) return;
    const dates = d => !d.start_date ? '' : d.end_date && d.end_date !== d.start_date
      ? `${shortDate(d.start_date)} – ${shortDate(d.end_date)}` : shortDate(d.start_date);
    slotEl('docs').insertAdjacentHTML('beforeend', `
      <section id="section-docs">
        <div class="subchart-label">Documents</div>
        ${data.docs.map(d => `<div class="doc-row">📄 ${docLinkHTML(d)}${dates(d) ? ` <span class="doc-dates">${esc(dates(d))}</span>` : ''}</div>`).join('')}
      </section>`);
  }

  function draftBannerHTML(data) {
    const expires = data.plan.sketch_expires_at;
    return `<div class="draft-banner">${expires ? 'Sketch' : 'Draft'}: not committed, so not part of the plan.${expires ? ` Expires ${shortDate(expires.slice(0, 10))} unless committed.` : ''}</div>`;
  }

  function renderPlanHead(data, versions) {
    if (!data) return;
    const { plan, role, version } = data;
    const race = version?.race_date ? `${distLabel(version.distance_bucket)} · ${shortDate(version.race_date)}` : '';
    const draftLink = DRAFT_VIEW && plan.status !== 'draft'
      ? `<a class="plan-which-link" href="?plan=${plan.plan_id}#plan">View committed plan</a>`
      : !isUncommitted(data) && versions.some(v => v.committed_at == null)
        ? `<a class="plan-which-link" href="?plan=${plan.plan_id}&draft=1#plan">View open draft</a>` : '';
    slotEl('plans').insertAdjacentHTML('beforeend', `
      <div class="plan-which">
        <span class="plan-which-title">${esc(plan.title)}</span>
        ${race ? `<span class="plan-which-race">${esc(race)}</span>` : ''}
        ${ROLE_TAG[role] ? `<span class="plan-which-role">${ROLE_TAG[role]}</span>` : ''}
        ${draftLink}
      </div>
      ${isUncommitted(data) ? draftBannerHTML(data) : ''}`);
  }

  // Newest first by start week; plans with no weeks last.
  function renderAllPlans(plans) {
    const sorted = [...plans].sort((a, b) => (b.first_week ?? '').localeCompare(a.first_week ?? ''));
    slotEl('all').insertAdjacentHTML('beforeend', plansTableHTML(sorted));
    makeSortable(document.getElementById('plans-table'));
  }

  // -----------------------------------------------------------------------
  // Compare mode (adr/0010) — two to four sides on one page, reusing the
  // calendar renderers. A side is a plan version, a plan's draft, or the
  // athlete's synced runs; each is normalized to weeks + per-date sessions.
  // The first side is the baseline: the others are shaded against it, never
  // against each other. Weeks pair by date when every other side overlaps the
  // baseline's weeks, else all sides pair by position.
  // -----------------------------------------------------------------------

  const CMP_SLOTS = [['cmphead', 70], ['cmpsum', 110], ['cmpchart', 260], ['cmpweeks', 400]];
  // A `vs` value is `<plan id>|actual[:draft][:FROM..TO]` (plan_compare._vs_spec).
  function parseVs(v) {
    const [id, ...opts] = v.split(':');
    return { actual: id === 'actual', plan: id, draft: opts.includes('draft'), range: parseWeekRange(opts.find(o => o.includes('..'))) };
  }
  const CMP_SIDES = COMPARE.length
    ? [{ plan: SELECTED_PLAN, draft: DRAFT_VIEW, range: parseWeekRange(QUERY.get('weeks')) }, ...COMPARE.map(parseVs)]
    : [];
  const COMPARE_DATA = []; // side index -> day popover data
  // Blue, aqua, yellow, violet: the palette's most distinct four, skipping the green that run/slot colours use and the magenta tint.
  const cmpColor = i => chartTheme().series[[0, 1, 2, 4][i]];

  function parseWeekRange(v) {
    const m = /^(\d{4}-\d{2}-\d{2})\.\.(\d{4}-\d{2}-\d{2})$/.exec(v ?? '');
    return m ? [m[1], m[2]] : null;
  }

  async function loadSide(key) {
    const s = CMP_SIDES[key];
    const inRange = d => !s.range || (s.range[0] <= d && d <= s.range[1]);
    if (s.actual) {
      if (!s.range) throw new Error('an actual side needs a range: vs=actual:YYYY-MM-DD..YYYY-MM-DD');
      const data = await loadPlanApi(`/api/actual-weeks?from_week=${s.range[0]}&to_week=${s.range[1]}`);
      const runs = new Map(Object.entries(data.actual));
      return {
        key, actual: true, title: 'Actual runs', cells: new Map(), runs,
        popover: { dayByDate: new Map(), actualByDate: runs, logByDate: new Map(), docs: [] },
        weeks: data.weeks.map(w => ({
          week_start: w.week_start, miles: w.actual_miles, workouts: w.actual_workouts,
          long: Math.max(0, ...Array.from({ length: 7 }, (_, i) => (runs.get(addDays(w.week_start, i)) ?? []).map(r => r.distance_mi)).flat()) || null,
        })),
      };
    }
    const data = await loadPlan(s.plan, s.draft);
    const weeks = data.weeks.filter(w => inRange(w.week_start));
    if (!weeks.length) throw new Error('no weeks in that range');
    const days = data.days.filter(d => inRange(mondayOf(d.date)));
    return {
      key, data, title: data.plan.title + (s.draft ? ' (draft)' : ''), uncommitted: isUncommitted(data), href: `?plan=${data.plan.plan_id}${s.draft ? '&draft=1' : ''}#plan`,
      cells: groupSessionsByDate(days), runs: new Map(),
      popover: planData({ ...data, days, actual: {} }),
      weeks: weeks.map(w => ({ week_start: w.week_start, ...weekMiles(w, days), workouts: w.target_workouts, long: w.target_long_run_miles })),
    };
  }

  // A plan week's compare miles and whether they are its target: the sum of its
  // planned days when it has run days and none lacks miles, else the week's
  // target (repMiles). plan_compare._week_miles applies the same rule.
  const COMPARE_RUN_SLOTS = ['easy', 'workout', 'long', 'race'];
  function weekMiles(w, days) {
    const run = days.filter(d => mondayOf(d.date) === w.week_start && COMPARE_RUN_SLOTS.includes(d.slot));
    const total = Math.round(run.reduce((t, d) => t + (d.target_miles ?? 0), 0) * 10) / 10;
    return total > 0 && run.every(d => d.target_miles != null)
      ? { miles: total, isTarget: false }
      : { miles: repMiles(w), isTarget: true };
  }

  const pairsByDate = sides => sides.slice(1).every(s => s.weeks.some(w => sides[0].weeks.some(b => b.week_start === w.week_start)));

  function alignWeeks(sides) {
    const maps = sides.map(s => new Map(s.weeks.map(w => [w.week_start, w])));
    const byDate = pairsByDate(sides);
    const rows = byDate
      ? [...new Set(maps.flatMap(m => [...m.keys()]))].sort().map(d => ({ label: weekRangeLabel(d), weeks: maps.map(m => m.get(d)) }))
      : Array.from({ length: Math.max(...sides.map(s => s.weeks.length)) }, (_, i) => ({ label: `Week ${i + 1}`, weeks: sides.map(s => s.weeks[i]) }));
    return { byDate, rows };
  }

  const sideRange = s => `${shortDate(s.weeks[0].week_start)} – ${shortDate(addDays(s.weeks[s.weeks.length - 1].week_start, 6))}`;

  function sideHeadHTML(s) {
    const role = s.data ? ROLE_TAG[s.data.role] : null;
    return `<div class="cmp-head-side">
      <div class="plan-which">
        <span class="cmp-dot" style="background:${cmpColor(s.key)}"></span>
        <span class="plan-which-title">${esc(s.title)}</span>
        ${role ? `<span class="plan-which-role">${role}</span>` : ''}
        <span class="plan-which-race">${esc(sideRange(s))}</span>
        ${s.href ? `<a class="plan-which-link" href="${s.href}">View alone</a>` : ''}
      </div>
      ${s.uncommitted ? draftBannerHTML(s.data) : ''}
    </div>`;
  }

  const CMP_SUM_COLS = ['Side', 'Weeks', 'Total', 'Avg', 'Peak', 'Wkts/wk', 'Long run']; // average and peak week, workouts per week, longest long run

  // The weeks each side's summary covers, and a note when that is fewer than
  // some plan side has. By date, the weeks every plan side has; by position,
  // the first N where N is the shortest plan side. A runs side keeps its own
  // weeks within that set and never shrinks it. plan_compare.shared_weeks
  // applies the same rule.
  function sharedWeeks(sides) {
    const plans = sides.filter(s => !s.actual);
    const all = { weeks: sides.map(s => s.weeks), note: null };
    if (plans.length < 2) return all;
    let size, span = '', pick;
    if (pairsByDate(sides)) {
      const dates = plans.map(s => new Set(s.weeks.map(w => w.week_start)));
      const keep = [...dates[0]].filter(d => dates.every(x => x.has(d))).sort();
      size = keep.length;
      if (size) span = `, ${shortDate(keep[0])} – ${shortDate(keep[size - 1])}`;
      pick = s => s.weeks.filter(w => keep.includes(w.week_start));
    } else {
      size = Math.min(...plans.map(s => s.weeks.length));
      pick = s => s.weeks.slice(0, size);
    }
    if (!size || plans.every(s => s.weeks.length === size)) return all;
    return { weeks: sides.map(pick), note: `Figures cover the ${size} weeks all plans share${span}.` };
  }

  function sideSummaryHTML(s, weeks) {
    const nums = k => weeks.map(w => w[k]).filter(v => v != null);
    const miles = nums('miles'), workouts = nums('workouts'), longs = nums('long');
    const sum = miles.reduce((x, y) => x + y, 0);
    const mi = v => v == null ? '—' : v.toFixed(1);
    const cells = [
      s.weeks.length, mi(miles.length ? sum : null), mi(miles.length ? sum / miles.length : null), mi(miles.length ? Math.max(...miles) : null),
      workouts.length ? (workouts.reduce((x, y) => x + y, 0) / workouts.length).toFixed(1) : '—', mi(longs.length ? Math.max(...longs) : null),
    ];
    return `<td class="cmp-sum-name" title="${esc(s.title)}"><span class="cmp-dot" style="background:${cmpColor(s.key)}"></span>${esc(s.title)}</td>${cells.map(c => `<td class="r">${c}</td>`).join('')}`;
  }

  // Lines draw the baseline as a wide pale band and every other side thin on
  // top with its own dash and marker, so sides with equal weekly miles stay
  // distinguishable; Bars group one bar per side per week.
  const CMP_LINE_STYLES = [
    { dash: null, symbol: 'none', glyph: 'wide band' },
    { dash: [8, 5], symbol: 'circle', glyph: 'long dash ●' },
    { dash: [2, 4], symbol: 'triangle', glyph: 'dots ▲' },
    { dash: 'solid', symbol: 'diamond', glyph: 'solid ◆' },
  ];
  const CMP_VIEW_KEY = 'miles.compareChart';
  const CMP_VIEWS = { lines: 'Lines', bars: 'Bars' };

  function renderCmpChart(...loaded) {
    const sides = loaded.slice(0, CMP_SIDES.length); // the last input is echartsReady
    const { rows } = alignWeeks(sides);
    const seriesName = s => s.actual ? `${s.title} (actual miles)` : `${s.title} (planned)`;
    let view = 'lines';
    try { if (localStorage.getItem(CMP_VIEW_KEY) === 'bars') view = 'bars'; } catch { /* storage unavailable */ }
    slotEl('cmpchart').insertAdjacentHTML('beforeend', `
      <section>
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:0.5rem">
          <h2>Weekly mileage</h2>
          <div class="mode-tabs" id="cmp-chart-views" style="margin-bottom:0">${Object.entries(CMP_VIEWS).map(([k, label]) => `<button class="mode-tab" data-view="${k}">${label}</button>`).join('')}</div>
        </div>
        <p class="desc" id="cmp-chart-desc"></p>
        <div class="chart-wrap"><div id="chart-compare" style="width:100%;height:100%"></div></div>
        <div class="chart-legend" id="cmp-chart-legend"></div>
      </section>`);
    const theme = chartTheme();
    const chart = echarts.init(document.getElementById('chart-compare'));
    TAB_CHARTS.plan.push(chart);
    const seriesFor = (s, i) => ({ name: seriesName(s), data: rows.map(r => r.weeks[i]?.miles ?? null) });
    const lineSeries = (s, i) => {
      const st = CMP_LINE_STYLES[i];
      const color = cmpColor(s.key);
      return {
        ...seriesFor(s, i), type: 'line', step: 'end', symbol: st.symbol, symbolSize: 8, itemStyle: { color },
        ...(i === 0 ? { lineStyle: { color, width: 12, opacity: 0.22 }, z: 1 } : { lineStyle: { color, width: 2, type: st.dash }, z: 2 + i }),
      };
    };
    const barSeries = (s, i) => ({ ...seriesFor(s, i), type: 'bar', itemStyle: { color: cmpColor(s.key) }, barGap: theme.compact ? '0%' : '10%', barCategoryGap: theme.compact ? '15%' : '30%' });
    const desc = {
      lines: 'Planned miles per week (days' sum, else the week target at its range midpoint) · actual synced miles for runs · the first side is the wide band, the others run on top of it',
      bars: 'Planned miles per week (days' sum, else the week target at its range midpoint) · actual synced miles for runs · one bar per side per week',
    };
    const legendNote = i => view === 'lines' ? ` <span style="color:var(--muted)">· ${CMP_LINE_STYLES[i].glyph}</span>` : '';
    function draw() {
      document.querySelectorAll('#cmp-chart-views .mode-tab').forEach(b => b.classList.toggle('active', b.dataset.view === view));
      document.getElementById('cmp-chart-desc').textContent = desc[view];
      document.getElementById('cmp-chart-legend').innerHTML = sides.map((s, i) => `<span class="legend-swatch"><span class="legend-box" style="background:${cmpColor(s.key)}"></span>${esc(seriesName(s))}${legendNote(i)}</span>`).join('');
      chart.setOption({
        animation: false,
        grid: { top: 24, right: 24, bottom: 32, left: 48 },
        tooltip: { trigger: 'axis', backgroundColor: theme.surface, borderColor: theme.gridline, textStyle: { fontSize: 12, color: theme.text } },
        xAxis: { type: 'category', data: rows.map(r => r.label), axisLine: { lineStyle: { color: theme.gridline } }, axisTick: { show: false }, axisLabel: { fontSize: 11, color: theme.muted, ...(theme.compact ? { interval: 'auto' } : {}) } },
        yAxis: { type: 'value', name: 'Miles', nameLocation: 'middle', nameGap: 34, nameTextStyle: { fontSize: 11, color: theme.muted }, axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: theme.gridline } }, axisLabel: { fontSize: 11, color: theme.muted } },
        series: sides.map(view === 'lines' ? lineSeries : barSeries),
      }, true);
    }
    document.querySelectorAll('#cmp-chart-views .mode-tab').forEach(b => b.addEventListener('click', () => {
      view = b.dataset.view;
      try { localStorage.setItem(CMP_VIEW_KEY, view); } catch { /* storage unavailable */ }
      draw();
    }));
    draw();
    window.addEventListener('resize', () => chart.resize());
  }

  // Total miles within max(CMP_NEGLIGIBLE_MI, CMP_NEGLIGIBLE_FRAC of the larger day) are the same.
  const CMP_NEGLIGIBLE_MI = 1, CMP_NEGLIGIBLE_FRAC = 0.15;

  function cmpSessions(s, date) {
    return s.actual
      ? (s.runs.get(date) ?? []).map(r => ({ slot: runSlot(r.run_type), miles: r.distance_mi, title: '' }))
      : (s.cells.get(date) ?? []).filter(x => !isRestSlot(x)).map(x => ({ slot: x.slot, miles: x.target_miles ?? 0, title: x.title ?? '' }));
  }

  // How far a day differs from the baseline's, 0-4: 1 title only or a
  // strength session only, 2 a mileage gap past the negligible one, 3 a gap
  // over 3 mi or a different set of run session types (including a run on one
  // side only), 4 a gap over 6 mi. plan_compare.py lists the same days.
  function cmpLevel(base, other, withTitles) {
    const sum = l => l.reduce((t, x) => t + x.miles, 0);
    const key = (l, f) => [...new Set(l.map(f))].sort().join('|');
    const runs = l => l.filter(x => x.slot !== 'strength');
    const a = sum(runs(base)), b = sum(runs(other)), gap = Math.abs(a - b);
    const level = gap <= Math.max(CMP_NEGLIGIBLE_MI, CMP_NEGLIGIBLE_FRAC * Math.max(a, b)) ? 0 : gap <= 3 ? 2 : gap <= 6 ? 3 : 4;
    if (key(runs(base), x => x.slot) !== key(runs(other), x => x.slot)) return Math.max(level, 3);
    return level || (key(base, x => x.slot) !== key(other, x => x.slot) || (withTitles && key(base, x => x.title) !== key(other, x => x.title)) ? 1 : 0);
  }

  function renderCmpWeeks(...sides) {
    const { byDate, rows } = alignWeeks(sides);
    const labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const none = new Map();
    const dot = s => `<span class="cmp-dot" style="background:${cmpColor(s.key)}"></span>`;
    const runOpts = { showType: true };
    const rowLabel = (s, w) => `<div class="cmp-id" title="${esc(s.title)}">${dot(s)}${esc(s.title)}</div>
      ${byDate ? '' : `<div class="cmp-sub">${esc(weekRangeLabel(w.week_start))}</div>`}
      <div>${w.miles != null ? `<span class="cmp-mi">${trimMiles(w.miles)} mi${w.isTarget ? ' target' : ''}</span>` : ''}<span class="cmp-sub">${[w.workouts != null ? `${w.workouts} workout${w.workouts === 1 ? '' : 's'}` : null, w.long != null ? `long ${trimMiles(w.long)}` : null].filter(Boolean).join(' · ')}</span></div>`;
    const line = (s, w) => w
      ? `<div class="cmp-line" data-side="${s.key}"><div class="cmp-line-label">${rowLabel(s, w)}</div>${weekRow(w, s.cells, s.runs, none, runOpts)}</div>`
      : `<div class="cmp-line"><div class="cmp-line-label"><div class="cmp-id" title="${esc(s.title)}">${dot(s)}${esc(s.title)}</div></div><div class="cmp-empty">No week on this side</div></div>`;
    // One side's session line for a weekday in the phone layout.
    const mobileLine = (s, w, date) => {
      const planned = (s.cells.get(date) ?? []).filter(x => !isRestSlot(x));
      const body = s.actual
        ? (s.runs.get(date) ?? []).map(r => runLine(r, runOpts)).join('')
        : planned.length ? planned.map(mobileSessionHTML).join('') : '<div class="mcal-rest">Rest</div>';
      return `<div class="cmp-mline" data-side="${s.key}" data-plan-date="${date}">${dot(s)}${byDate ? '' : `<span class="cmp-mdate">${esc(shortDate(date))}</span>`}<div class="mcal-day-body">${body}</div></div>`;
    };
    const mobileWeek = row => labels.map((name, k) => {
      const present = sides.filter((s, i) => row.weeks[i]);
      return `<div class="mcal-day-row"><div class="mcal-day-wd">${name}</div><div class="cmp-mlines">${present.map(s => mobileLine(s, row.weeks[s.key], addDays(row.weeks[s.key].week_start, k))).join('')}</div></div>`;
    }).join('');
    const levels = [];
    // A day of synced runs that has not ended and has no run yet is not a difference.
    const today = new Date().toLocaleDateString('en-CA');
    const pending = (s, d) => s.actual && d >= today && !cmpSessions(s, d).length;
    const base = sides[0];
    const html = rows.map((row, i) => {
      levels[i] = sides.map(() => new Map());
      for (let j = 1; j < sides.length && row.weeks[0] && row.weeks[j]; j++) {
        for (let k = 0; k < 7; k++) {
          const db = addDays(row.weeks[0].week_start, k), dj = addDays(row.weeks[j].week_start, k);
          levels[i][j].set(dj, pending(base, db) || pending(sides[j], dj) ? 0 : cmpLevel(cmpSessions(base, db), cmpSessions(sides[j], dj), !base.actual && !sides[j].actual));
        }
      }
      const missing = sides.filter((s, j) => !row.weeks[j]);
      return `<div class="cmp-week" data-row="${i}">
        <div class="cmp-week-head"><span>${esc(row.label)}</span></div>
        <div class="cal">
          <div class="cmp-line"><div></div><div class="cal-header">${labels.map(d => `<div class="cal-hcell">${d}</div>`).join('')}</div></div>
          ${sides.map((s, j) => line(s, row.weeks[j])).join('')}
        </div>
        <div class="cal-cards">${missing.length ? `<div class="cmp-empty">No week for ${missing.map(s => esc(s.title)).join(', ')}</div>` : ''}<div class="mcal-week">${mobileWeek(row)}</div></div>
      </div>`;
    }).join('');
    slotEl('cmpweeks').insertAdjacentHTML('beforeend', `
      <section>
        <h2>Weeks</h2>
        <p class="desc">Every side after the first is shaded by how far each day differs from the first side's same weekday: faint for a title only (plan against plan) or a strength session only, stronger for a bigger mileage gap, a different run type or a run on one side only; gaps within ${CMP_NEGLIGIBLE_MI} mi or ${CMP_NEGLIGIBLE_FRAC * 100}% of the larger day are not shaded · tap a day for detail</p>
        ${html}
      </section>`);
    document.querySelectorAll('.cmp-week').forEach(el => {
      const lv = levels[Number(el.dataset.row)];
      el.querySelectorAll('[data-side] [data-plan-date], .cmp-mline').forEach(c => {
        const level = lv[Number(c.closest('[data-side]').dataset.side)].get(c.dataset.planDate);
        if (level) c.classList.add(`cmp-d${level}`);
      });
    });
  }

  // Each side's header fills its own element, so one side failing leaves the others.
  function fillSides(id, sides, render) {
    sides.forEach((p, i) => {
      const target = document.getElementById(`${id}-${i}`);
      p.then(s => { target.innerHTML = render(s); })
        .catch(err => { target.innerHTML = `<p class="desc">Couldn't load this side: ${esc(err.message)}</p>`; });
    });
  }

  function startCompare() {
    const sideP = CMP_SIDES.map((_, i) => loadSide(i));
    sideP.forEach((p, i) => p.then(s => { COMPARE_DATA[i] = s.popover; }, () => {}));
    const skeleton = height => `<div class="skeleton" style="height:${height}px;margin-bottom:1rem"></div>`;
    slotEl('cmphead').innerHTML = sideP.map((_, i) => `<div id="cmphead-${i}">${skeleton(40)}</div>`).join('');
    slotEl('cmpsum').innerHTML = `<p class="desc" id="cmpsum-note" hidden></p><div class="scroll"><table class="cmp-sum"><thead><tr>${CMP_SUM_COLS.map((c, i) => `<th${i ? ' class="r"' : ''}>${c}</th>`).join('')}</tr></thead>
      <tbody>${sideP.map((_, i) => `<tr id="cmpsum-${i}"><td colspan="${CMP_SUM_COLS.length}">${skeleton(20)}</td></tr>`).join('')}</tbody></table></div>`;
    fillSides('cmphead', sideP, sideHeadHTML);
    // The summaries wait for every side, since each covers the weeks all plans share.
    Promise.allSettled(sideP).then(results => {
      const loaded = results.flatMap(r => r.status === 'fulfilled' ? [r.value] : []);
      const { weeks, note } = sharedWeeks(loaded);
      if (note) Object.assign(document.getElementById('cmpsum-note'), { textContent: note, hidden: false });
      results.forEach((r, i) => {
        document.getElementById(`cmpsum-${i}`).innerHTML = r.status === 'fulfilled'
          ? sideSummaryHTML(r.value, weeks[loaded.indexOf(r.value)])
          : `<td colspan="${CMP_SUM_COLS.length}"><p class="desc">Couldn't load this side: ${esc(r.reason.message)}</p></td>`;
      });
    });
    fillPanel('cmpchart', [...sideP, echartsReady], renderCmpChart);
    fillPanel('cmpweeks', sideP, renderCmpWeeks);
    document.title = 'Miles · Compare plans';
  }

  // Today needs only /api/plan and /api/today; everything else is fetched
  // once Today has painted so it never competes with them. currentP is the
  // default (current) plan; planP the one the Plan tab shows.
  function startSecondaryPanels(currentP, planP) {
    const get = (promise, fallback) => promise.catch(() => fallback);
    // Adherence and goals describe the committed plan, so a draft view skips them.
    const adherenceP = DRAFT_VIEW ? Promise.resolve(null) : loadAdherence();
    const goalsP = DRAFT_VIEW ? Promise.resolve(null) : loadGoals();

    // The target-band chart needs a current plan; otherwise the plain rolling window.
    const progressionP = currentP.then(d => (d && d.role === 'current' ? loadProgression() : loadProgressionFallback()));
    fillPanel('easy', [progressionP, echartsReady], renderProgressionEasy);
    fillPanel('workouts', [progressionP, echartsReady], renderProgressionWorkouts);
    fillPanel('mileage', [loadWeeklyHistory(), echartsReady], renderRecentMileage);
    fillPanel('load', [loadLoad(), echartsReady], renderLoad);
    fillPanel('fitness', [progressionP], renderFitnessStrip);

    const headExtraP = planP.then(d => {
      if (!d || isUncommitted(d)) return null;
      if (d.plan.status === 'completed') return loadRetrospective();
      return d.plan.status === 'active' ? loadReadiness() : null;
    });
    const plansP = loadPlans();
    const versionsP = loadVersions();
    fillPanel('plans', [planP, versionsP], renderPlanHead);
    fillPanel('all', [plansP], renderAllPlans);
    const bandsP = get(adherenceP.then(a => new Map((a.weeks ?? []).map(w => [w.week_start, w.band]))), new Map());
    fillPanel('head', [planP, headExtraP, get(adherenceP, null), echartsReady, get(goalsP, null)],
      (data, extra, adherence, _echarts, goals) => {
        if (!data) return renderPlanEmptyCard();
        if (isUncommitted(data)) return;
        if (data.plan.status === 'completed') renderRetrospective(data, extra, goals);
        else renderReadiness(data, adherence, extra);
      });
    fillPanel('goals', [goalsP], renderGoals);
    fillPanel('chart', [planP, bandsP, get(adherenceP, null), echartsReady],
      (data, bands, adherence) => { if (data) renderChart(data, bands, adherence?.flags ?? []); });
    fillPanel('calendar', [planP, bandsP, get(goalsP, null)], (data, bands, goals) => { if (data) renderCalendar(data, bands, goals); });
    fillPanel('docs', [planP], renderDocs);
    fillPanel('flags', [adherenceP], renderFlags);
    fillPanel('versions', [versionsP], renderVersions);
    planP.then(d => { PLAN_TAB_DATA = planData(d); }, () => {});
  }

  renderTabs();
  if (COMPARE.length) {
    activatePlanTab('plan');
    startCompare();
  } else {
    const currentP = loadPlan();
    const planP = SELECTED_PLAN ? loadPlan(SELECTED_PLAN, DRAFT_VIEW) : currentP;
    const todayP = loadToday().catch(() => null);

    activatePlanTab((location.hash || (SELECTED_PLAN ? '#plan' : '#today')).replace('#', ''));

    Promise.all([currentP, todayP]).then(([data, today]) => {
      PLAN_DATA = planData(data, today?.actual);
      document.getElementById('tab-today').innerHTML = '';
      if (data && data.today) {
        renderToday(data);
      } else if (today) {
        renderTodayDashboard(today);
      }
      startSecondaryPanels(currentP, planP);
    }).catch(err => {
      document.getElementById('tab-today').innerHTML = `<p class="desc">Couldn't load today: ${esc(err.message)}</p>`;
      startSecondaryPanels(currentP, planP);
    });
    planP.then(d => { document.title = d ? `Miles · ${d.plan.title}` : 'Miles · Plan'; }, () => {});
  }

  document.getElementById('root').addEventListener('click', e => {
    // A muted in-page link (e.g. the dashboard's "see the Plan tab")
    // switches tabs instead of navigating to a real page.
    const jumpTab = e.target.closest('[data-tab-jump]');
    if (jumpTab) { e.preventDefault(); activatePlanTab(jumpTab.dataset.tabJump); return; }
    if (e.target.closest('a.doc-link')) return;
    const el = e.target.closest('[data-plan-date]');
    if (el) {
      const side = el.closest('[data-side]');
      openDayPopover(el.dataset.planDate, side ? COMPARE_DATA[side.dataset.side] : el.closest('#tab-plan') ? PLAN_TAB_DATA : PLAN_DATA);
      return;
    }
    // In-page section anchors (e.g. Readiness's "Workout progression" link)
    // can point into a different, currently-hidden tab — switch tabs before
    // scrolling, or the browser's default jump lands on a zero-height panel.
    const jump = e.target.closest('a[href^="#section-"]');
    if (jump) {
      e.preventDefault();
      const targetId = jump.getAttribute('href').slice(1);
      activatePlanTab('trends');
      document.getElementById(targetId)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
</script>
