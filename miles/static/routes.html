<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miles · Routes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .routes-view .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .routes-view .create-btn {
      flex: none; padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 600; text-decoration: none;
      color: #fff; background: var(--accent); border-radius: 6px;
    }
    .routes-view .head-links { display: flex; align-items: center; gap: 1rem; flex: none; }
    .routes-view .manage-link { font-size: 0.875rem; color: var(--accent); }
    .routes-view .entity-link { color: inherit; text-decoration: none; }
    .routes-view .entity-link:hover { text-decoration: underline; }
    .routes-view .skeleton-row { height: 2.25rem; margin-bottom: 0.375rem; }
  </style>
</head>
<body>
<script src="/nav.js"></script>
<script src="/charts.js"></script>

<main class="routes-view page-view">
  <div class="head">
    <div>
      <h1>Routes</h1>
      <p class="subtitle" id="subtitle">Loading…</p>
    </div>
    <div class="head-links">
      <a class="manage-link" href="/areas.html">Areas</a>
      <a class="create-btn" href="/create-route.html">Create a route</a>
    </div>
  </div>
  <div id="root">
    <div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>
  </div>
</main>

<script>
  const root = document.getElementById('root');
  const subtitle = document.getElementById('subtitle');

  function row(r) {
    const dist = r.distance_m != null ? (r.distance_m / MILE_METERS).toFixed(1) : '—';
    const gain = r.gain_m != null ? Math.round(r.gain_m * FT_PER_METER).toLocaleString() : '—';
    const name = r.name ?? r.gpx_name ?? 'Untitled route';
    return `<tr>
      <td><a class="entity-link" href="/route.html?id=${r.route_id}">${esc(name)}</a></td>
      <td class="r">${dist}</td>
      <td class="r">${gain}</td>
      <td class="hide-sm">${esc(r.shape ? r.shape.replace(/_/g, ' ') : '—')}</td>
      <td class="hide-sm">${esc(r.location ?? '—')}</td>
      <td class="hide-sm">${esc(r.source ?? '—')}</td>
    </tr>`;
  }

  async function main() {
    const res = await getJson('/api/routes');
    if (res.error) {
      subtitle.textContent = '';
      root.innerHTML = `<div class="error">Could not load routes: ${esc(res.error)}</div>`;
      return;
    }
    const routes = res.data;
    subtitle.textContent = `${routes.length} saved route${routes.length === 1 ? '' : 's'}, newest first`;
    if (!routes.length) {
      root.innerHTML = '<div class="loading">No routes yet. Create one or upload a GPX file.</div>';
      return;
    }
    root.innerHTML = `
      <div class="scroll dense">
        <table>
          <thead><tr>
            <th>Name</th><th class="r">Miles</th><th class="r">Gain (ft)</th><th class="hide-sm">Shape</th>
            <th class="hide-sm">Location</th><th class="hide-sm">Source</th>
          </tr></thead>
          <tbody>${routes.map(row).join('')}</tbody>
        </table>
      </div>`;
    makeSortable(root.querySelector('table'));
  }

  main();
</script>
</body>
</html>
