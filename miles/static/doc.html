<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miles · Plan document</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
  <link rel="stylesheet" href="/theme.css">
  <script id="marked-script" defer src="https://cdn.jsdelivr.net/npm/marked@18.1.3/lib/marked.umd.js" integrity="sha384-tp/syYhgK+FeVVrz2SPmgKX5atVZ8P8hReAvOPUn58M265VNy1IbdmZAY7Jmd0gF" crossorigin="anonymous"></script>
  <style>
    .doc-view { max-width: 46rem; margin: 0 auto; }
    .doc-view .doc-back { display: inline-block; font-size: 0.8125rem; color: var(--accent); text-decoration: none; margin-bottom: 0.75rem; }
    .doc-view .doc-back:hover { text-decoration: underline; }
    .doc-view h1 { font-size: 1.375rem; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
    .doc-view .subtitle { font-size: 0.8125rem; color: var(--muted); margin-bottom: 1.25rem; }
    .doc-view .doc-index ul { list-style: none; padding: 0; }
    .doc-view .doc-index li { padding: 0.5rem 0; border-bottom: 1px solid var(--gridline); display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; align-items: baseline; }
    .doc-view .doc-index a { color: var(--accent); font-weight: 600; }
    .doc-view .doc-index .subtitle { margin: 0; }
    .doc-view .doc-body { font-size: 1rem; line-height: 1.6; color: var(--text); overflow-wrap: anywhere; }
    .doc-view .doc-body > * + * { margin-top: 0.875rem; }
    .doc-view .doc-body h1, .doc-view .doc-body h2, .doc-view .doc-body h3 { font-weight: 650; line-height: 1.3; margin-top: 1.5rem; }
    .doc-view .doc-body h1 { font-size: 1.25rem; }
    .doc-view .doc-body h2 { font-size: 1.125rem; }
    .doc-view .doc-body h3 { font-size: 1rem; }
    .doc-view .doc-body ul, .doc-view .doc-body ol { padding-left: 1.5rem; }
    .doc-view .doc-body li + li { margin-top: 0.25rem; }
    .doc-view .doc-body a { color: var(--accent); }
    .doc-view .doc-body hr { border: none; border-top: 1px solid var(--gridline); }
    .doc-view .doc-body code { font-size: 0.875em; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 0 0.25rem; }
    .doc-view .doc-body blockquote { border-left: 3px solid var(--baseline); padding-left: 0.875rem; color: var(--text-secondary); }
    .doc-view .doc-body table { width: max-content; min-width: 100%; font-size: 0.875rem; }
    .doc-view .doc-body th, .doc-view .doc-body td { padding: 0.375rem 0.75rem; text-align: left; border-bottom: 1px solid var(--gridline); }
  </style>
</head>
<body>
<script src="/nav.js"></script>

<main class="doc-view">
  <a class="doc-back" id="back" href="/plan.html#plan">&larr; Plan</a>
  <div id="doc"><div class="skeleton" style="height:1.5rem;width:60%;margin-bottom:0.75rem"></div><div class="skeleton" style="height:0.875rem;width:40%;margin-bottom:1.5rem"></div><div class="skeleton" style="height:16rem"></div></div>
</main>

<script>
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g,
      ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function shortDate(dateStr) {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  const markedReady = new Promise((resolve, reject) => {
    const script = document.getElementById('marked-script');
    script.addEventListener('load', resolve);
    script.addEventListener('error', () => reject(new Error('markdown library failed to load')));
  });

  // Raw HTML in the body is shown as text, and links keep only safe schemes.
  const SAFE_HREF = /^(https?:|mailto:|#|\/)/i;
  function renderMarkdown(body) {
    marked.use({
      renderer: { html: token => esc(token.text) },
      walkTokens: token => {
        if ((token.type === 'link' || token.type === 'image') && !SAFE_HREF.test(token.href)) token.href = '#';
      },
    });
    const box = document.createElement('div');
    box.innerHTML = marked.parse(body);
    box.querySelectorAll('table').forEach(t => {
      const wrap = document.createElement('div');
      wrap.className = 'scroll';
      t.replaceWith(wrap);
      wrap.append(t);
    });
    return box.innerHTML;
  }

  async function getJson(url, notFound) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status === 404 ? notFound : `HTTP ${res.status}`);
    return res.json();
  }

  function datesLine(doc) {
    if (!doc.start_date) return '';
    return doc.end_date && doc.end_date !== doc.start_date
      ? `${shortDate(doc.start_date)} – ${shortDate(doc.end_date)}` : shortDate(doc.start_date);
  }

  const BODY_SKELETON = '<div class="skeleton" style="height:16rem"></div>';
  const docEl = document.getElementById('doc');
  const params = new URLSearchParams(location.search);

  function showError(selector, what, err) {
    docEl.querySelector(selector).replaceWith(Object.assign(document.createElement('p'), {
      className: 'desc', textContent: `Couldn't load ${what}: ${err.message}`,
    }));
  }

  function showPlanDoc() {
    Promise.all([getJson(`/api/plan-docs/${encodeURIComponent(params.get('id'))}`, 'No such document.'), markedReady]).then(([doc]) => {
      document.title = `Miles · ${doc.title}`;
      document.getElementById('back').href = `/plan.html?plan=${doc.plan_id}#plan`;
      docEl.innerHTML = `
        <h1>${esc(doc.title)}</h1>
        <p class="subtitle">${[esc(doc.plan_title), esc(datesLine(doc))].filter(Boolean).join(' · ')}</p>
        <div class="doc-body">${renderMarkdown(doc.body)}</div>`;
    }).catch(err => showError('#doc', 'this document', err));
  }

  // A notebook page: ?page=<name>. The title is known from the address, so it
  // renders at once with a skeleton where the body will go.
  function showNotebookPage(name) {
    document.title = `Miles · ${name}`;
    const back = document.getElementById('back');
    back.textContent = '← Notebook';
    back.href = '/doc.html';
    docEl.innerHTML = `<h1>${esc(name)}</h1><p class="subtitle" id="updated">&nbsp;</p><div class="doc-body">${BODY_SKELETON}</div>`;
    Promise.all([getJson(`/api/notebook/${encodeURIComponent(name)}`, 'No such page.'), markedReady]).then(([page]) => {
      document.getElementById('updated').textContent = `Updated ${shortDate(page.updated_at.slice(0, 10))}`;
      docEl.querySelector('.doc-body').innerHTML = renderMarkdown(page.body);
    }).catch(err => showError('.doc-body', 'this page', err));
  }

  function showNotebookIndex() {
    document.title = 'Miles · Notebook';
    document.getElementById('back').remove();
    docEl.innerHTML = `<h1>Notebook</h1><p class="subtitle">Standing pages that outlive any plan.</p><div class="doc-index">${BODY_SKELETON}</div>`;
    getJson('/api/notebook').then(pages => {
      docEl.querySelector('.doc-index').innerHTML = pages.length
        ? `<ul>${pages.map(p => `<li><a href="/doc.html?page=${encodeURIComponent(p.name)}">${esc(p.name)}</a>
            <span class="subtitle">${p.size.toLocaleString()} characters · updated ${esc(shortDate(p.updated_at.slice(0, 10)))}</span></li>`).join('')}</ul>`
        : '<p class="desc">No pages yet.</p>';
    }).catch(err => showError('.doc-index', 'the notebook', err));
  }

  if (params.has('id')) showPlanDoc();
  else if (params.get('page')) showNotebookPage(params.get('page'));
  else showNotebookIndex();
</script>
</body>
</html>
